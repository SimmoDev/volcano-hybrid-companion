# Minimal example: exercises the `volcano` external component's BLE
# connection -- decoded heater/pump and auto-shutoff countdown state to the
# log -- plus two-way number/switch controls (auto-shutoff duration,
# heater/pump on/off, target temperature, and more), on the Phase 1
# development board (ADR-0004). Its state and controls are reachable both
# from the local web_server page and, per ADR-0012, from Home Assistant
# through the ESPHome `api` component. See components/volcano/README.md
# and ADR-0002/ADR-0003/ADR-0007 for the architecture this follows.
#
# The Volcano's BLE MAC address is unique per unit and deliberately not
# recorded in this repository (see docs/protocol/README.md). Copy
# secrets.yaml.example to secrets.yaml alongside it and set your device's
# address as `volcano_mac_address`, your WiFi credentials as
# `wifi_ssid`/`wifi_password`, and an `api_encryption_key` (see the
# comments above `api` and `web_server` below). The example file's
# placeholders satisfy `esphome config`/`compile`; flashing to hardware
# needs real values.

esphome:
  name: volcano-dev-scaffold

# Shows the component's connection lifecycle and decoded state on boot and
# as they change.
logger:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components

ble_client:
  - mac_address: !secret volcano_mac_address
    id: volcano_ble_client

volcano:
  id: volcano_component
  ble_client_id: volcano_ble_client
  # Optional -- exposes decoded state on the web_server page below,
  # including on-panel changes. Everything the device lets us both read
  # and write is a single two-way control rather than a readout plus
  # separate setters.
  #
  # Whether the abstraction layer's state is READY (ADR-0009) -- the link
  # is up AND the initial read sweep has completed. This is what the
  # switches below cannot tell you themselves: none of them can express
  # "unknown", so each holds its last state across a disconnect rather than
  # resetting. This is the entity to watch instead.
  connected:
    name: "Connected"
    web_server:
      sorting_weight: 5
  current_temperature:
    name: "Current temperature"
    web_server:
      sorting_weight: 30
  auto_shutoff_countdown:
    name: "Auto-shutoff countdown"
    web_server:
      sorting_weight: 50
  # Heater and pump are switches: each reports the device's state and
  # toggles it, so there is one control per actuator rather than a readout
  # plus separate on/off triggers.
  #
  # Named "Heat" and "Air" to match the labels on the Volcano's own panel
  # and in the official app, so the two read the same side by side. The
  # keys stay `heater`/`pump`, matching this project's terminology and the
  # device firmware's own identifiers -- see docs/CONVENTIONS.md.
  heater:
    name: "Heat"
    web_server:
      sorting_weight: 10
  pump:
    name: "Air"
    web_server:
      sorting_weight: 20
  # `mode: box` on both numbers takes a typed value rather than the default
  # slider, which also keeps the unit label aligned with the sensor rows.
  #
  # min/max default to the range CMD-001 confirms accepted (40.0-230.0 degC).
  # Widened here deliberately, so this example can also exercise the
  # component's refusal path: a value outside the confirmed range is rejected
  # in software (logged, nothing written) and never reaches the device.
  target_temperature:
    name: "Target temperature"
    mode: box
    web_server:
      sorting_weight: 40
    min_value: 30
    max_value: 240
  # Left at the default 1-360 minutes, the range CMD-003 confirms accepted.
  # Per STATE-005 a duration write only takes effect at the *next arming*,
  # not on a countdown already running: to see a new value take effect, set
  # it while the device is fully idle (heater off, pump off, countdown at 0).
  auto_shutoff_duration:
    name: "Auto-shutoff duration"
    mode: box
    web_server:
      sorting_weight: 60
  # Whether the device buzzes on reaching temperature. The register bit is
  # inverted (clear means enabled), which the component handles -- this
  # switch reads and writes in the obvious sense.
  vibration:
    name: "Vibration"
    web_server:
      sorting_weight: 80
  # Whether the device shows current temperature on its own display while
  # cooling. Display-only: current temperature keeps notifying over BLE
  # regardless, so nothing this component reads is affected.
  display_on_cooling:
    name: "Display on cooling"
    web_server:
      sorting_weight: 85
  # ON means Fahrenheit. The device's own +/- panel gesture changes the same
  # setting, and this switch follows it either way (CMD-010, STATE-010).
  display_units_fahrenheit:
    name: "Display in Fahrenheit"
    web_server:
      sorting_weight: 90
  # CMD-002 records a 0-100 scale, which is the default range here.
  led_brightness:
    name: "LED brightness"
    mode: box
    web_server:
      sorting_weight: 70
  # The heater-runtime meter: minutes counts 0-59 and carries into hours,
  # and both advance only while the heater is on rather than tracking
  # wall-clock time. Notify-capable, so they update live.
  hours_of_operation:
    name: "Hours of operation"
    web_server:
      sorting_weight: 130
  minutes_of_operation:
    name: "Minutes of operation"
    web_server:
      sorting_weight: 140
  # Device information: fixed per unit, read once on connect, never written.
  # Marked diagnostic, so they group separately from the controls.
  #
  # The serial number is unique to your device -- worth remembering before
  # sharing a screenshot or a log, in the same way as the BLE address.
  #
  # Weights offset by 100 from the (none)/config groups' own 5-90 range,
  # matching the M5Stack Dial example's identical scheme (examples/dial/
  # volcano-entities.yaml) exactly -- see that file's own comment for why
  # the offset exists, and for the ordering these weights follow (matching
  # the Dial's About/Diagnostics pages' own layout).
  serial_number:
    name: "Serial number"
    web_server:
      sorting_weight: 110
  power_supply:
    name: "Power supply"
    web_server:
      sorting_weight: 120
  product_line:
    name: "Product line"
    web_server:
      sorting_weight: 150
  firmware_version:
    name: "Firmware version"
    web_server:
      sorting_weight: 170
  ble_firmware_version:
    name: "BLE firmware version"
    web_server:
      sorting_weight: 180

# WiFi is needed for web_server below and for the Home Assistant `api`
# connection -- the volcano component itself is BLE-only and has no
# dependency on it. Credentials come from secrets.yaml, not committed.
#
# reboot_timeout is 0s for the same ADR-0001 reason as `api` below: the
# ESPHome default reboots the device after 15 minutes without a WiFi
# association, which would break control of the Volcano whenever the
# network is simply down. The cost is losing that automatic recovery
# from a wedged WiFi stack.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

# Home Assistant integration, per ADR-0012. Exposes the same `volcano`
# entities as the web_server page below; nothing about the component
# changes when this block is present, absent, or disconnected (ADR-0003).
# reboot_timeout is 0s because ADR-0001 requires the device to keep
# controlling the Volcano when Home Assistant is unreachable -- the
# ESPHome default would reboot it once no API client had connected for
# 15 minutes. The encryption key comes from secrets.yaml, not committed;
# generate your own with `openssl rand -base64 32` (the example file
# ships a placeholder). Same trusted-home-network assumption as
# web_server, but the API is encrypted where the web page is not.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Serves a local page with a control per value above, for manual testing
# without extra hardware. It listens on this device's local IP with no
# authentication and no TLS -- fine on a trusted home network for this
# development example, but not something to expose beyond it.
web_server:
  port: 80
  local: true
  # Version 3 is what supports `sorting_weight` on entities, used above
  # to group the controls by what they do rather than leaving them in
  # the alphabetical order the page would otherwise fall back to.
  version: 3
