# Minimal example: exercises the `volcano` external component's read-only
# BLE connection -- decoded heater/pump and auto-shutoff countdown state to
# the log -- plus manually-triggered commands (auto-shutoff duration,
# heater/pump on/off), on the Phase 1 development board (ADR-0004). It has
# no Home Assistant integration; see components/volcano/README.md and
# ADR-0002/ADR-0003/ADR-0007 for the architecture this follows.
#
# The Volcano's BLE MAC address is unique per unit and deliberately not
# recorded in this repository (see docs/protocol/README.md). Copy
# secrets.yaml.example to secrets.yaml alongside it and set your device's
# address as `volcano_mac_address`, and your WiFi credentials as
# `wifi_ssid`/`wifi_password` (needed for the web-based command buttons
# below -- see the comment above `web_server`).

esphome:
  name: volcano-dev-scaffold

# Shows the component's connection lifecycle and decoded state on boot and
# as they change.
logger:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components

ble_client:
  - mac_address: !secret volcano_mac_address
    id: volcano_ble_client

volcano:
  id: volcano_component
  ble_client_id: volcano_ble_client

# WiFi is needed only for web_server below, to reach the command buttons
# from a browser -- the volcano component itself is BLE-only and has no
# dependency on it. Credentials come from secrets.yaml, not committed.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Serves a local page with a button per command below, for manual testing
# without extra hardware. It listens on this device's local IP with no
# authentication and no TLS -- fine on a trusted home network for this
# development example, but not something to expose beyond it.
web_server:
  port: 80
  local: true

button:
  - platform: template
    name: "Heater on"
    on_press:
      - lambda: |-
          id(volcano_component).turn_heater_on();
  - platform: template
    name: "Heater off"
    on_press:
      - lambda: |-
          id(volcano_component).turn_heater_off();
  - platform: template
    name: "Pump on"
    on_press:
      - lambda: |-
          id(volcano_component).turn_pump_on();
  - platform: template
    name: "Pump off"
    on_press:
      - lambda: |-
          id(volcano_component).turn_pump_off();
  # CMD-003's confirmed floor: the lowest duration verified accepted, read
  # back unchanged, loaded at the next arming, and honoured through to an
  # actual expiry -- the component itself refuses anything shorter (see
  # components/volcano/volcano.h). Per STATE-005, a duration write only
  # takes effect at the *next arming*, not on a countdown already running:
  # to see it take effect, the device must be fully idle (heater off, pump
  # off, countdown at 0) *before* pressing this, not mid-countdown.
  - platform: template
    name: "Set auto-shutoff duration to 60s"
    on_press:
      - lambda: |-
          id(volcano_component).set_auto_shutoff_duration_seconds(60);
