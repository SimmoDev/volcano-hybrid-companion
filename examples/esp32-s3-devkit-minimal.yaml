# Minimal example: exercises the `volcano` external component's first
# working increment -- a read-only BLE connection that logs decoded heater
# and pump state -- on the Phase 1 development board (ADR-0004). It exposes
# no sensors/entities and has no Home Assistant or UI logic; see
# components/volcano/README.md and ADR-0002/ADR-0003/ADR-0007 for the
# architecture this follows.
#
# The Volcano's BLE MAC address is unique per unit and deliberately not
# recorded in this repository (see docs/protocol/README.md). Copy
# secrets.yaml.example to secrets.yaml alongside it and set your device's
# address as `volcano_mac_address`.

esphome:
  name: volcano-dev-scaffold

# Shows the component's connection lifecycle and decoded state on boot and
# as they change.
logger:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components

ble_client:
  - mac_address: !secret volcano_mac_address
    id: volcano_ble_client

volcano:
  ble_client_id: volcano_ble_client
