# Minimal example: exercises the `volcano` external component's read-only
# BLE connection -- decoded heater/pump and auto-shutoff countdown state to
# the log -- plus manually-triggered commands (auto-shutoff duration,
# heater/pump on/off, target temperature), on the Phase 1 development board
# (ADR-0004). It has no Home Assistant integration; see
# components/volcano/README.md and ADR-0002/ADR-0003/ADR-0007 for the
# architecture this follows.
#
# The Volcano's BLE MAC address is unique per unit and deliberately not
# recorded in this repository (see docs/protocol/README.md). Copy
# secrets.yaml.example to secrets.yaml alongside it and set your device's
# address as `volcano_mac_address`, and your WiFi credentials as
# `wifi_ssid`/`wifi_password` (needed for the web-based command controls
# below -- see the comment above `web_server`).

esphome:
  name: volcano-dev-scaffold

# Shows the component's connection lifecycle and decoded state on boot and
# as they change.
logger:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components

ble_client:
  - mac_address: !secret volcano_mac_address
    id: volcano_ble_client

volcano:
  id: volcano_component
  ble_client_id: volcano_ble_client
  # Optional -- exposes decoded state on the web_server page below,
  # including on-panel changes. Everything the device lets us both read
  # and write is a single two-way control rather than a readout plus
  # separate setters.
  current_temperature:
    name: "Current temperature"
    web_server:
      sorting_weight: 30
  auto_shutoff_countdown:
    name: "Auto-shutoff countdown"
    web_server:
      sorting_weight: 50
  # Heater and pump are switches: each reports the device's state and
  # toggles it, so there is one control per actuator rather than a readout
  # plus separate on/off triggers.
  #
  # Named "Heat" and "Air" to match the labels on the Volcano's own panel
  # and in the official app, so the two read the same side by side. The
  # keys stay `heater`/`pump`, matching this project's terminology and the
  # device firmware's own identifiers -- see docs/CONVENTIONS.md.
  heater:
    name: "Heat"
    web_server:
      sorting_weight: 10
  pump:
    name: "Air"
    web_server:
      sorting_weight: 20
  # `mode: box` on both numbers takes a typed value rather than the default
  # slider, which also keeps the unit label aligned with the sensor rows.
  #
  # min/max default to the range CMD-001 confirms accepted (40.0-230.0 degC).
  # Widened here deliberately, so this example can also exercise the
  # component's refusal path: a value outside the confirmed range is rejected
  # in software (logged, nothing written) and never reaches the device.
  target_temperature:
    name: "Target temperature"
    mode: box
    web_server:
      sorting_weight: 40
    min_value: 30
    max_value: 240
  # Left at the default 1-360 minutes, the range CMD-003 confirms accepted.
  # Per STATE-005 a duration write only takes effect at the *next arming*,
  # not on a countdown already running: to see a new value take effect, set
  # it while the device is fully idle (heater off, pump off, countdown at 0).
  auto_shutoff_duration:
    name: "Auto-shutoff duration"
    mode: box
    web_server:
      sorting_weight: 60
  # CMD-002 records a 0-100 scale, which is the default range here.
  led_brightness:
    name: "LED brightness"
    mode: box
    web_server:
      sorting_weight: 70
  # The heater-runtime meter: minutes counts 0-59 and carries into hours,
  # and both advance only while the heater is on rather than tracking
  # wall-clock time. Notify-capable, so they update live.
  hours_of_operation:
    name: "Hours of operation"
  minutes_of_operation:
    name: "Minutes of operation"
  # Device information: fixed per unit, read once on connect, never written.
  # Marked diagnostic, so they group separately from the controls.
  #
  # The serial number is unique to your device -- worth remembering before
  # sharing a screenshot or a log, in the same way as the BLE address.
  firmware_version:
    name: "Firmware version"
  ble_firmware_version:
    name: "BLE firmware version"
  serial_number:
    name: "Serial number"
  power_supply:
    name: "Power supply"
  product_line:
    name: "Product line"

# WiFi is needed only for web_server below, to reach the controls
# from a browser -- the volcano component itself is BLE-only and has no
# dependency on it. Credentials come from secrets.yaml, not committed.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Serves a local page with a control per value above, for manual testing
# without extra hardware. It listens on this device's local IP with no
# authentication and no TLS -- fine on a trusted home network for this
# development example, but not something to expose beyond it.
web_server:
  port: 80
  local: true
  # Version 3 is what supports `sorting_weight` on entities, used above
  # to group the controls by what they do rather than leaving them in
  # the alphabetical order the page would otherwise fall back to.
  version: 3
