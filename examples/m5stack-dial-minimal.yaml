# M5Stack Dial firmware, growing incrementally per ADR-0010/ADR-0011.
# Hardware bring-up is done -- display, touch, rotary encoder, physical
# button, the volcano component, and LVGL itself are all individually
# confirmed against real hardware (see git history for that trail). This
# now also carries ADR-0011's Home page (current/target temperature with
# rotary adjustment and write-coalescing debounce, a unit indicator that
# converts per ADR-0008, Heat/Air buttons, the auto-shutoff countdown,
# BLE/WiFi status icons), its Navigation Menu, Settings (vibration/
# display-on-cooling/display-units toggles), and the split Information
# page it names -- About and Diagnostics here, each its own menu entry.
# LED Brightness and Auto-Shutoff Duration are also built now, following
# ADR-0011's shared rotary-adjusted-value template. Only Dial Brightness
# remains unbuilt among the numeric pages.
#
# Still no api/web_server -- nothing here needs them yet; that's ADR-0010's
# decision to retain them, not yet exercised. WiFi itself is present purely
# so the WiFi status icon has something real to reflect.
#
# The Dial is built on the M5StampS3 module (ESP32-S3, 8MB flash), matching
# the "M5Stack StampS3" PlatformIO board definition -- confirmed against the
# connected device's USB VID:PID (303A:1001).
#
# Each `on_*` handler below logs at DEBUG so `esphome logs` gives a direct,
# manual way to re-confirm a given peripheral still works, the same
# verification this file was built up against on real hardware.

esphome:
  name: volcano-dial-scaffold
  # ESPHOME_PROJECT_VERSION (used on the About page below) is compiled
  # from this -- our own firmware's version, distinct from the Volcano's
  # own firmware/BLE firmware versions the volcano component reports.
  project:
    name: "volcano-hybrid-companion.dial"
    version: "0.1.0"
  on_boot:
    then:
      - output.set_level:
          id: dial_backlight_pwm
          level: 100%
      # LVGL auto-adds every newly-created focusable widget to whatever
      # group is current default once an encoder exists (click_focusable:
      # false on Home's buttons/Settings' switches only stops a *touch*
      # granting focus, it doesn't stop this membership). Confirmed on
      # real hardware for Heat/Air already; the same bug hit Settings'
      # switches too -- every widget here auto-joins the same one
      # default group at creation regardless of which page it's on, and
      # nothing had explicitly focused the Menu's roller yet on the very
      # first button press from Home, so that press landed on whichever
      # switch the group happened to default-focus and toggled it,
      # silently writing to the Volcano before the Settings page was
      # ever even shown. Evicting everything meant to be touch-only
      # keeps the encoder/button reserved for temperature/menu use on
      # Home and Settings, per ADR-0011. The LED Brightness and Auto-
      # Shutoff Duration pages' step-size buttons are the same story:
      # click_focusable: false alone doesn't stop group membership, so
      # they need evicting too.
      - lambda: |-
          lv_group_remove_obj(id(heat_button));
          lv_group_remove_obj(id(air_button));
          lv_group_remove_obj(id(settings_vibration_switch));
          lv_group_remove_obj(id(settings_display_on_cooling_switch));
          lv_group_remove_obj(id(settings_display_units_switch));
          lv_group_remove_obj(id(led_brightness_step_1_button));
          lv_group_remove_obj(id(led_brightness_step_10_button));
          lv_group_remove_obj(id(auto_shutoff_duration_step_1_button));
          lv_group_remove_obj(id(auto_shutoff_duration_step_10_button));
          lv_group_remove_obj(id(auto_shutoff_duration_step_30_button));

logger:

esp32:
  board: m5stack-stamps3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

# on_connect/on_disconnect fire on the raw BLE link, before volcano's own
# service-discovery/read-sweep completes -- combined with volcano's
# `connected` (READY-only) below, this is what lets the Home page's BLE
# icon distinguish CONNECTING from DISCONNECTED, which `connected` alone
# cannot (ADR-0009: it only ever reports true once READY).
ble_client:
  - mac_address: !secret volcano_mac_address
    id: volcano_ble_client
    on_connect:
      - globals.set:
          id: ble_connecting
          value: "true"
    on_disconnect:
      - globals.set:
          id: ble_connecting
          value: "false"
      - lvgl.label.update:
          id: ble_status_icon
          text_color: 0xCC0000

# WiFi is needed only so the Home page's WiFi status icon has something
# real to reflect -- the volcano component itself is BLE-only and has no
# dependency on it, and no other WiFi-dependent capability (api/
# web_server) exists in this config yet, per ADR-0010.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - lvgl.label.update:
        id: wifi_status_icon
        text_color: 0x00CC44
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status_icon
        text_color: 0xCC0000

# Tracks whether the BLE link is up but volcano is not yet READY, so the
# 500ms interval below can blink the BLE icon while CONNECTING. ble_blink_on
# is that interval's own toggle state, not read anywhere else.
#
# pending_target_temp_c is the Home page's own local notion of the target
# temperature (ADR-0011's write-coalescing): the encoder adjusts it and the
# label always renders it immediately, but VolcanoDevice only hears about
# it once commit_target_temperature's debounce settles. Every confirmed
# report from the device re-seeds it too, so an external change (the
# Volcano's own panel, say) is reflected the same way a local turn is.
# NaN until the first real report -- the encoder is a no-op until then,
# rather than adjusting from a meaningless baseline. last_encoder_raw is
# the rotary_encoder sensor's own running count, needed only to compute
# each turn's delta.
#
# pending_led_brightness is the LED Brightness page's own equivalent of
# pending_target_temp_c -- same write-coalescing shape (ADR-0011), same
# NaN-until-first-report guard, sharing last_encoder_raw since only one
# rotary-adjusted page is ever showing at a time.
globals:
  - id: ble_connecting
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_blink_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pending_target_temp_c
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: last_encoder_raw
    type: float
    restore_value: false
    initial_value: "0"
  - id: pending_led_brightness
    type: float
    restore_value: false
    initial_value: "NAN"
  # How much one detent adjusts pending_led_brightness by -- the LED
  # Brightness page's own step-size buttons (1/10) set this, so a full
  # sweep of the 0-100 range doesn't need 100 detents of fine adjustment.
  # Not persisted across reboot; always starts at the fine (1) step.
  - id: led_brightness_step
    type: float
    restore_value: false
    initial_value: "1.0"
  # Auto-Shutoff Duration's own equivalents of the LED Brightness pair
  # above -- same write-coalescing shape, same step-size-buttons idea,
  # just three steps (1/10/30) instead of two since 1-360 minutes is a
  # wider range than 0-100%.
  - id: pending_auto_shutoff_duration_min
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: auto_shutoff_duration_step
    type: float
    restore_value: false
    initial_value: "1.0"

volcano:
  id: volcano_component
  ble_client_id: volcano_ble_client
  # Internal: consumed directly by the Home page's LVGL widgets below via
  # each entity's own automation triggers, not exposed anywhere else yet
  # (no api/web_server in this config).
  connected:
    id: volcano_connected
    internal: true
    on_press:
      - globals.set:
          id: ble_connecting
          value: "false"
      - lvgl.label.update:
          id: ble_status_icon
          text_color: 0x00CC44
    # READY lost is CONNECTING again per ADR-0009 (reconnection isn't
    # distinguished from a first connection) -- unless the link itself
    # dropped too, in which case ble_client's own on_disconnect above
    # also fires and sets DISCONNECTED; whichever settles last visually
    # wins, which is a minor, acceptable race, not a functional problem.
    on_release:
      - globals.set:
          id: ble_connecting
          value: "true"
  # Values are always Celsius on this side of the component (ADR-0008);
  # display_units_fahrenheit is the device's own display setting, and
  # converting for presentation is this control interface's job, not
  # the component's -- see the refresh_*_temp_label scripts below.
  current_temperature:
    id: volcano_current_temperature
    internal: true
    on_value:
      - script.execute: refresh_current_temp_label
  target_temperature:
    id: volcano_target_temperature
    internal: true
    on_value:
      - globals.set:
          id: pending_target_temp_c
          value: !lambda "return x;"
      - script.execute: refresh_target_temp_label
  display_units_fahrenheit:
    id: volcano_display_units_fahrenheit
    internal: true
    on_turn_on:
      - lvgl.label.update:
          id: units_label
          text: "°F"
      - script.execute: refresh_current_temp_label
      - script.execute: refresh_target_temp_label
      - lambda: "lv_obj_add_state(id(settings_display_units_switch), LV_STATE_CHECKED);"
      - lvgl.label.update:
          id: settings_units_c_label
          text_color: 0x888888
      - lvgl.label.update:
          id: settings_units_f_label
          text_color: 0x00D9FF
    on_turn_off:
      - lvgl.label.update:
          id: units_label
          text: "°C"
      - script.execute: refresh_current_temp_label
      - script.execute: refresh_target_temp_label
      - lambda: "lv_obj_remove_state(id(settings_display_units_switch), LV_STATE_CHECKED);"
      - lvgl.label.update:
          id: settings_units_c_label
          text_color: 0x00D9FF
      - lvgl.label.update:
          id: settings_units_f_label
          text_color: 0x888888
  # Settings page toggles (ADR-0011). Each entity's own on_turn_on/off
  # keeps its switch and the flanking Off/On (or C/F) labels in sync
  # with the confirmed device state, including changes made elsewhere
  # (the Volcano's own panel, say) -- whichever option is currently
  # active is coloured cyan, the other dim grey.
  #
  # Sets LV_STATE_CHECKED via the raw LVGL call, not lvgl.switch.update
  # (state: {checked: ...}): that action goes through ESPHome's own
  # LvglComponent::lv_obj_set_state_value helper, which deliberately
  # fires the same update event a real user toggle does (its own
  # comment: "fire an event if changed (only needed for CHECKED)"),
  # risking exactly the kind of write-on-sync feedback loop that turned
  # out to be caused by something else entirely on this page (see the
  # group-eviction lambda in on_boot above) -- kept anyway as the more
  # robust choice now that the actual cause is understood.
  vibration:
    id: volcano_vibration
    internal: true
    on_turn_on:
      - lambda: "lv_obj_add_state(id(settings_vibration_switch), LV_STATE_CHECKED);"
      - lvgl.label.update:
          id: settings_vibration_off_label
          text_color: 0x888888
      - lvgl.label.update:
          id: settings_vibration_on_label
          text_color: 0x00D9FF
    on_turn_off:
      - lambda: "lv_obj_remove_state(id(settings_vibration_switch), LV_STATE_CHECKED);"
      - lvgl.label.update:
          id: settings_vibration_off_label
          text_color: 0x00D9FF
      - lvgl.label.update:
          id: settings_vibration_on_label
          text_color: 0x888888
  display_on_cooling:
    id: volcano_display_on_cooling
    internal: true
    on_turn_on:
      - lambda: "lv_obj_add_state(id(settings_display_on_cooling_switch), LV_STATE_CHECKED);"
      - lvgl.label.update:
          id: settings_cooling_off_label
          text_color: 0x888888
      - lvgl.label.update:
          id: settings_cooling_on_label
          text_color: 0x00D9FF
    on_turn_off:
      - lambda: "lv_obj_remove_state(id(settings_display_on_cooling_switch), LV_STATE_CHECKED);"
      - lvgl.label.update:
          id: settings_cooling_off_label
          text_color: 0x00D9FF
      - lvgl.label.update:
          id: settings_cooling_on_label
          text_color: 0x888888
  auto_shutoff_countdown:
    id: volcano_auto_shutoff_countdown
    internal: true
    on_value:
      - lvgl.label.update:
          id: countdown_label
          text: !lambda |-
            if (std::isnan(x))
              return std::string("--:--");
            int total = (int) x;
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", total / 60, total % 60);
            return std::string(buf);
  # Rotary-adjusted per ADR-0011's shared numeric-page template, same
  # write-coalescing shape as target_temperature above -- pending_led_
  # brightness/commit_led_brightness/refresh_led_brightness_label mirror
  # pending_target_temp_c/commit_target_temperature/refresh_target_temp_label.
  led_brightness:
    id: volcano_led_brightness
    internal: true
    on_value:
      - globals.set:
          id: pending_led_brightness
          value: !lambda "return x;"
      - script.execute: refresh_led_brightness_label
  # Same shape again -- unit_of_measurement is minutes already (see the
  # component's own number_schema), so no conversion is needed here; the
  # minutes-to-seconds conversion for the underlying write happens inside
  # VolcanoAutoShutoffDurationNumber::control() itself, not this UI.
  auto_shutoff_duration:
    id: volcano_auto_shutoff_duration
    internal: true
    on_value:
      - globals.set:
          id: pending_auto_shutoff_duration_min
          value: !lambda "return x;"
      - script.execute: refresh_auto_shutoff_duration_label
  heater:
    id: volcano_heater
    internal: true
    on_turn_on:
      - lvgl.widget.update:
          id: heat_button
          bg_color: 0xFF7A00
    on_turn_off:
      - lvgl.widget.update:
          id: heat_button
          bg_color: 0x333333
  pump:
    id: volcano_pump
    internal: true
    on_turn_on:
      - lvgl.widget.update:
          id: air_button
          bg_color: 0xFF7A00
    on_turn_off:
      - lvgl.widget.update:
          id: air_button
          bg_color: 0x333333
  # Device-information strings, per ADR-0009 exempt from the disconnect-
  # clears-unknown rule other fields follow -- known once read, they stay
  # known across a dropout, so no NaN/"unknown" handling is needed the
  # way the temperature/countdown labels above need it.
  firmware_version:
    id: volcano_firmware_version
    internal: true
    on_value:
      - lvgl.label.update:
          id: about_volcano_firmware_value
          text: !lambda "return x;"
  ble_firmware_version:
    id: volcano_ble_firmware_version
    internal: true
    on_value:
      - lvgl.label.update:
          id: about_volcano_ble_firmware_value
          text: !lambda "return x;"
  product_line:
    id: volcano_product_line
    internal: true
    on_value:
      - lvgl.label.update:
          id: about_product_line_value
          text: !lambda "return x;"
  serial_number:
    id: volcano_serial_number
    internal: true
    on_value:
      - lvgl.label.update:
          id: diagnostics_serial_value
          text: !lambda "return x;"
  power_supply:
    id: volcano_power_supply
    internal: true
    on_value:
      - lvgl.label.update:
          id: diagnostics_power_supply_value
          text: !lambda "return x;"
  # Time of operation stays combined onto one value (ADR-0011) rather
  # than splitting hours/minutes into their own rows -- both notify
  # independently, so either one changing refreshes the shared label
  # via the same script.
  hours_of_operation:
    id: volcano_hours_of_operation
    internal: true
    on_value:
      - script.execute: refresh_time_of_operation_label
  minutes_of_operation:
    id: volcano_minutes_of_operation
    internal: true
    on_value:
      - script.execute: refresh_time_of_operation_label

# The GC9A01A round panel over SPI. Pins confirmed against a known-working
# community M5Dial configuration, not just the pinout reference --
# MOSI/SCK/CS/DC/RST as below; backlight is a separate PWM-driven pin
# (GPIO9) the panel stays dark without.
spi:
  mosi_pin: GPIO5
  clk_pin: GPIO6

output:
  - platform: ledc
    pin: GPIO9
    id: dial_backlight_pwm

display:
  - platform: ili9xxx
    id: dial_display
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    dimensions:
      width: 240
      height: 240
    auto_clear_enabled: false
    update_interval: never

# The FT3267 touch panel, which is FT5x06-register-compatible -- confirmed
# against the same known-working community M5Dial configuration the display
# pins were checked against.
i2c:
  sda: GPIO11
  scl: GPIO12

touchscreen:
  platform: ft5x06
  id: dial_touchscreen
  address: 0x38
  on_touch:
    - lambda: |-
        ESP_LOGD("main", "Touch at (%d, %d)", touch.x, touch.y);

# The rotary encoder (GPIO40/41, turn-only) and the separate physical
# button (GPIO42) that provides every "press" action in ADR-0011's
# navigation model -- the encoder itself has no click.
sensor:
  - platform: rotary_encoder
    name: "Dial Rotary Encoder"
    id: dial_rotary_encoder
    resolution: 1
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    on_value:
      - lambda: |-
          ESP_LOGD("main", "Encoder now at %d", (int) x);
      # Home page rotary semantics (ADR-0011): turning adjusts target
      # temperature directly -- but only on Home. This raw sensor-level
      # listener fires regardless of which page is showing, so it must
      # gate itself; without this it was also adjusting and writing
      # target temperature in the background while navigating the Menu.
      # x is the sensor's own running count, not a per-turn delta, hence
      # last_encoder_raw -- tracked unconditionally on every page (even
      # before the first connection), so a turn made elsewhere doesn't
      # register as one huge delta once back on Home. 1 degree C per
      # detent; clamped to CMD-001's confirmed-accepted range (40-230 C)
      # so pending_target_temp_c never drifts somewhere VolcanoBleClient
      # would refuse anyway.
      #
      # LED Brightness follows the same shape once its page is showing --
      # 1% per detent, clamped 0-100. Mutually exclusive branches (if/else,
      # not independent ifs) for the same reason as confirm_menu_selection's
      # chain: only one rotary-adjusted page is ever showing at a time, and
      # every branch must still update last_encoder_raw so a turn made
      # elsewhere doesn't register as one huge delta once back on a
      # rotary-adjusted page.
      - if:
          condition:
            lvgl.page.is_showing: home_page
          then:
            - lambda: |-
                float delta = x - id(last_encoder_raw);
                id(last_encoder_raw) = x;
                if (std::isnan(id(pending_target_temp_c)))
                  return;
                float next = id(pending_target_temp_c) + delta * 1.0f;
                if (next < 40.0f)
                  next = 40.0f;
                if (next > 230.0f)
                  next = 230.0f;
                id(pending_target_temp_c) = next;
            - script.execute: refresh_target_temp_label
            - script.execute: commit_target_temperature
          else:
            - if:
                condition:
                  lvgl.page.is_showing: led_brightness_page
                then:
                  - lambda: |-
                      float delta = x - id(last_encoder_raw);
                      id(last_encoder_raw) = x;
                      if (std::isnan(id(pending_led_brightness)))
                        return;
                      float next = id(pending_led_brightness) + delta * id(led_brightness_step);
                      if (next < 0.0f)
                        next = 0.0f;
                      if (next > 100.0f)
                        next = 100.0f;
                      id(pending_led_brightness) = next;
                  - script.execute: refresh_led_brightness_label
                  - script.execute: commit_led_brightness
                else:
                  - if:
                      condition:
                        lvgl.page.is_showing: auto_shutoff_duration_page
                      then:
                        - lambda: |-
                            float delta = x - id(last_encoder_raw);
                            id(last_encoder_raw) = x;
                            if (std::isnan(id(pending_auto_shutoff_duration_min)))
                              return;
                            float next = id(pending_auto_shutoff_duration_min) + delta * id(auto_shutoff_duration_step);
                            if (next < 1.0f)
                              next = 1.0f;
                            if (next > 360.0f)
                              next = 360.0f;
                            id(pending_auto_shutoff_duration_min) = next;
                        - script.execute: refresh_auto_shutoff_duration_label
                        - script.execute: commit_auto_shutoff_duration
                      else:
                        - lambda: |-
                            id(last_encoder_raw) = x;

binary_sensor:
  - platform: gpio
    name: "Dial Button"
    id: dial_button
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    # Button semantics (ADR-0011): from Home, opens the Navigation Menu;
    # from the Menu, confirms whatever the roller is currently scrolled to
    # (via confirm_menu_selection, not the roller's own on_click, which
    # is touch-only -- see its comment); from every other page, returns
    # to the Menu. Read directly rather than via LVGL's own group/edit-
    # mode click routing, which doesn't distinguish a physical-button
    # confirm from the button press that just opened the menu.
    #
    # Fires on_release: on press, the button is still physically down at
    # the moment the newly-shown page's focused widget appears, which
    # LVGL can read as an immediate confirm against it.
    #
    # The branches below are mutually exclusive (if/else, not independent
    # ifs) because lvgl.page.show is synchronous -- an independent
    # is_showing check run afterwards would see the page the prior branch
    # just switched to and match immediately. The final else needs no
    # changes as more pages are added: everything that isn't Home or the
    # Menu already falls into it.
    on_press:
      - logger.log: "Button pressed"
    on_release:
      - logger.log: "Button released"
      - if:
          condition:
            lvgl.page.is_showing: home_page
          then:
            - lvgl.page.show: menu_page
          else:
            - if:
                condition:
                  lvgl.page.is_showing: menu_page
                then:
                  - script.execute: confirm_menu_selection
                else:
                  - lvgl.page.show: menu_page

# Shared by both temperature entities' on_value and by
# display_units_fahrenheit's on_turn_on/on_turn_off (ADR-0008: the component
# always reports Celsius, so a unit change re-renders the last known value
# rather than waiting for the device's next report). Kept as two scripts,
# not one parameterised by which label/sensor to use, since ESPHome's YAML
# automations have no clean way to pass that in -- duplicating this much
# is simpler than the indirection needed to avoid it.
script:
  - id: refresh_current_temp_label
    then:
      - lvgl.label.update:
          id: current_temp_label
          text: !lambda |-
            float c = id(volcano_current_temperature).state;
            if (std::isnan(c))
              return std::string("--");
            float v = id(volcano_display_units_fahrenheit).state ? (c * 9.0f / 5.0f + 32.0f) : c;
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # ADR-0011's write-coalescing: fires 300ms after the encoder last
  # moved (mode: restart cancels and restarts the delay on every new
  # turn), not once per detent. VolcanoDevice refuses a second write to
  # a field while one is already outstanding (ADR-0009) and a confirmed
  # round trip is ~150-250ms on real hardware -- writing on every detent
  # would silently drop most of them. Guarded against a stale NaN
  # baseline; VolcanoBleClient's own range check would refuse it anyway,
  # but this avoids attempting a meaningless write in the first place.
  - id: commit_target_temperature
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: "return !std::isnan(id(pending_target_temp_c));"
          then:
            - number.set:
                id: volcano_target_temperature
                value: !lambda "return id(pending_target_temp_c);"
  # Reads pending_target_temp_c, not volcano_target_temperature.state --
  # this is the label a rotary turn updates immediately, before
  # commit_target_temperature's debounced write even fires, let alone
  # confirms.
  - id: refresh_target_temp_label
    then:
      - lvgl.label.update:
          id: target_temp_label
          text: !lambda |-
            float c = id(pending_target_temp_c);
            if (std::isnan(c))
              return std::string("--");
            float v = id(volcano_display_units_fahrenheit).state ? (c * 9.0f / 5.0f + 32.0f) : c;
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # LED Brightness's own commit/refresh pair, same shape as
  # commit_target_temperature/refresh_target_temp_label above -- see those
  # comments for why the debounce and the NaN guard exist.
  - id: commit_led_brightness
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: "return !std::isnan(id(pending_led_brightness));"
          then:
            - number.set:
                id: volcano_led_brightness
                value: !lambda "return id(pending_led_brightness);"
  - id: refresh_led_brightness_label
    then:
      - lvgl.label.update:
          id: led_brightness_value_label
          text: !lambda |-
            float v = id(pending_led_brightness);
            if (std::isnan(v))
              return std::string("--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # Auto-Shutoff Duration's own commit/refresh pair, same shape again.
  - id: commit_auto_shutoff_duration
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: "return !std::isnan(id(pending_auto_shutoff_duration_min));"
          then:
            - number.set:
                id: volcano_auto_shutoff_duration
                value: !lambda "return id(pending_auto_shutoff_duration_min);"
  - id: refresh_auto_shutoff_duration_label
    then:
      - lvgl.label.update:
          id: auto_shutoff_duration_value_label
          text: !lambda |-
            float v = id(pending_auto_shutoff_duration_min);
            if (std::isnan(v))
              return std::string("--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  - id: refresh_time_of_operation_label
    then:
      - lvgl.label.update:
          id: diagnostics_time_of_operation_value
          text: !lambda |-
            float h = id(volcano_hours_of_operation).state;
            float m = id(volcano_minutes_of_operation).state;
            if (std::isnan(h) || std::isnan(m))
              return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0fh %.0fm", h, m);
            return std::string(buf);
  # Shared by both the roller's on_click (touch, guarded to POINTER
  # there) and dial_button's on_release (button, on the Menu page) --
  # one place to add a branch when a new page/option is added, rather
  # than keeping the touch and button paths in sync by hand.
  - id: confirm_menu_selection
    then:
      - lambda: |-
          ESP_LOGD("main", "Menu confirmed: %s", id(nav_menu_roller).get_selected_text().c_str());
      - if:
          condition:
            lambda: 'return id(nav_menu_roller).get_selected_text() == "Home";'
          then:
            - lvgl.page.show: home_page
          else:
            - if:
                condition:
                  lambda: 'return id(nav_menu_roller).get_selected_text() == "Settings";'
                then:
                  - lvgl.page.show: settings_page
                else:
                  - if:
                      condition:
                        lambda: 'return id(nav_menu_roller).get_selected_text() == "LED Brightness";'
                      then:
                        - lvgl.page.show: led_brightness_page
                      else:
                        - if:
                            condition:
                              lambda: 'return id(nav_menu_roller).get_selected_text() == "Auto-Shutoff Duration";'
                            then:
                              - lvgl.page.show: auto_shutoff_duration_page
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(nav_menu_roller).get_selected_text() == "Diagnostics";'
                                  then:
                                    - lvgl.page.show: diagnostics_page
                                  else:
                                    # Only "About" left among the current
                                    # options -- add another explicit
                                    # branch here, not a new bare else,
                                    # once a seventh option exists.
                                    - lvgl.page.show: about_page

# Blinks the BLE status icon while CONNECTING (ble_connecting, set by
# ble_client's on_connect/on_disconnect and volcano's connected above).
# A no-op the rest of the time, so it doesn't fight the steady colours
# on_press/on_disconnect already set.
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: "return id(ble_connecting);"
          then:
            - globals.set:
                id: ble_blink_on
                value: !lambda "return !id(ble_blink_on);"
            - lvgl.label.update:
                id: ble_status_icon
                text_color: !lambda "return lv_color_hex(id(ble_blink_on) ? 0xFFA500 : 0x552B00);"

# DSEG7 Classic Bold (SIL OFL 1.1 -- see examples/fonts/DSEG-LICENSE.txt),
# chosen per ADR-0010/ADR-0011 so the Home page's temperature readouts
# echo the Volcano's own digital display. One size for both temperatures
# -- the device's own panel shows current and target at the same size,
# not a large/small hierarchy.
font:
  - file: "fonts/DSEG7Classic-Bold.ttf"
    id: font_temp
    size: 48

# The Home page (ADR-0011): current temperature (orange) and target
# temperature (cyan) echoing the Volcano's own display palette, touch-only
# Heat/Air actuator buttons, the auto-shutoff countdown, and BLE/WiFi
# status icons (green = connected, red = disconnected; BLE also flashes
# orange while CONNECTING, per the interval above -- WiFi doesn't get that
# third state, a deliberate scope call, not an oversight). Exact colours/
# layout are implementation detail per ADR-0011's Notes, not fixed by the
# ADR -- refined here against the real round display.
#
# Rotary-adjusted target temperature, with ADR-0011's write-coalescing
# debounce, is implemented -- see the rotary_encoder sensor's on_value
# and the commit_target_temperature/refresh_target_temp_label scripts
# above. The Navigation Menu (below) lists Home, Settings, LED Brightness,
# Auto-Shutoff Duration, Diagnostics, and About, in that order -- the
# latter two are ADR-0011's Information page, split in two rather than
# cramming six lines of device facts onto one (see the comment above
# about_page/diagnostics_page). Dial Brightness doesn't exist yet; it
# becomes a real menu entry once built, following LED Brightness/Auto-
# Shutoff Duration's pages as the template.
lvgl:
  displays:
    - dial_display
  encoders:
    - sensor: dial_rotary_encoder
      enter_button: dial_button
  pages:
    - id: home_page
      bg_color: 0x000000
      bg_opa: cover
      widgets:
        - label:
            id: current_temp_label
            align: center
            y: -40
            text_font: font_temp
            text_color: 0xFF7A00
            text_align: center
            text: "--"
        - label:
            id: target_temp_label
            align: center
            y: 24
            text_font: font_temp
            text_color: 0x00D9FF
            text_align: center
            text: "--"
        - label:
            id: units_label
            align: center
            y: 64
            text_font: montserrat_20
            text_color: 0x00D9FF
            text_align: center
            text: "°C"
        - label:
            id: countdown_label
            align: bottom_mid
            y: -18
            text_color: 0xFFFFFF
            text_align: center
            text: "--:--"
        # LV_SYMBOL_BLUETOOTH/LV_SYMBOL_WIFI (LVGL's own bundled icon
        # glyphs, no separate font asset needed -- confirmed present in
        # the vendored LVGL source under examples/.esphome/build/) written
        # as \u escapes since both are Private Use Area codepoints. No
        # strikethrough variant exists in LVGL's built-in set, so
        # DISCONNECTED is colour-only (steady red) rather than a crossed-
        # out icon -- a deliberate call within ADR-0011's "icon artwork is
        # implementation detail" allowance, not an oversight.
        - label:
            id: ble_status_icon
            align: top_mid
            x: -16
            y: 8
            text_color: 0xCC0000
            text: ""
        - label:
            id: wifi_status_icon
            align: top_mid
            x: 16
            y: 8
            text_color: 0xCC0000
            text: ""
        # click_focusable: false keeps these touch-only, per ADR-0011 --
        # without it, LVGL auto-joins every clickable widget to the
        # encoder's default group, so turning the knob was tab-cycling
        # between them and pressing the button was clicking whichever
        # one was highlighted. The Home page's encoder/button are
        # reserved for temperature/menu, not button focus-cycling.
        - button:
            id: heat_button
            align: left_mid
            x: 8
            width: 44
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: 0x333333
            click_focusable: false
            widgets:
              - label:
                  text: "Heat"
                  align: center
            on_click:
              - switch.toggle: volcano_heater
        - button:
            id: air_button
            align: right_mid
            x: -8
            width: 44
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: 0x333333
            click_focusable: false
            widgets:
              - label:
                  text: "Air"
                  align: center
            on_click:
              - switch.toggle: volcano_pump

    # The Navigation Menu (ADR-0011): rotary turn moves the highlighted
    # row, a press or a direct touch confirms it. A roller is LVGL's
    # built-in fit for exactly this -- unlike Home's Heat/Air, this is
    # the one place on the Dial where the encoder's default-group
    # behaviour (the same auto-add that had to be defeated on Home) is
    # what's wanted, so no click_focusable/group eviction here.
    - id: menu_page
      bg_color: 0x000000
      bg_opa: cover
      # Forces the roller straight into edit mode on every page load, so
      # the very first turn scrolls it immediately -- LVGL otherwise
      # needs an initial press to enter edit mode before rotation does
      # anything, which ADR-0011 doesn't call for (it wants turning to
      # move the highlight directly, no extra step first).
      #
      # on_load fires on LV_EVENT_SCREEN_LOAD_START, at the *start* of
      # the transition -- confirmed on real hardware that calling
      # lvgl.widget.focus here doesn't stick (editing read back false
      # immediately after, and rotation never moved the selection): the
      # transition's own focus handling runs after this event and
      # overwrites it. The delay pushes this past the animation
      # (page.show's own default time), so it runs after that settles.
      on_load:
        - delay: 100ms
        - lvgl.widget.focus:
            id: nav_menu_roller
            editing: true
      widgets:
        - roller:
            id: nav_menu_roller
            align: center
            width: 90%
            height: 110px
            visible_row_count: 3
            # bg_opa: cover -- bg_color alone doesn't paint anything.
            # border_width: 0 -- a plain themed border, unrelated to the
            # outline states below (border_width/outline_width are
            # separate LVGL style properties).
            bg_color: 0x000000
            bg_opa: cover
            border_width: 0
            text_color: 0xFFFFFF
            selected:
              bg_color: 0x333333
              text_color: 0x00D9FF
            # Kills the default theme's focus outline (focused/focus_key)
            # and its edit-state outline (edited -- this roller is forced
            # permanently into edit mode below), redundant given the
            # selected row above already shows what's highlighted.
            # Deliberately flat, not nested under a literal main: key --
            # ESPHome's LVGL widget config (collect_parts in
            # widgets/__init__.py) seeds the main part's default state
            # from this widget's own top-level properties, then merges in
            # any state named as a sibling top-level key (focused,
            # focus_key, edited, ...); a literal `main:` key is itself
            # treated as one of those states and replaces the seeded
            # default outright rather than merging with it, silently
            # discarding align/width/height/bg_color/text_color above.
            focused:
              outline_width: 0
            focus_key:
              outline_width: 0
            edited:
              outline_width: 0
            options:
              - "Home"
              - "Settings"
              - "LED Brightness"
              - "Auto-Shutoff Duration"
              - "Diagnostics"
              - "About"
            # Touch only -- guarded on the triggering indev being the
            # touchscreen, not the encoder/button. A physical-button
            # confirm is handled separately by dial_button's own
            # on_release, which reads the roller directly instead of
            # going through this click event: LVGL's group/edit-mode
            # click routing doesn't distinguish a button confirm from the
            # button press that opened the menu in the first place.
            on_click:
              - if:
                  condition:
                    lambda: "return lv_indev_get_type(lv_indev_get_act()) == LV_INDEV_TYPE_POINTER;"
                  then:
                    - script.execute: confirm_menu_selection

    # Settings (ADR-0011): touch toggles for vibration, display-on-
    # cooling, and display units, matching VolcanoDevice's existing
    # boolean fields. Read-only in the sense that there's no on_load/
    # on_click of its own beyond the toggles themselves: dial_button's
    # on_release already returns to the Menu from here, same as About/
    # Diagnostics.
    #
    # Same caption-then-control pairing as About/Diagnostics (a page-
    # level flex column, each pair its own two widgets) rather than
    # full-width label-left/switch-right rows -- those needed
    # flex_align_main: space_between to push the switch to the row's
    # right edge, but that positions it based on each row's *own* total
    # content width, so it landed at a different x on every row once the
    # captions were different lengths (worse once Units also had a
    # trailing "°F" label, which pushed its switch further left still).
    # Compact, centred control clusters side-step that: every switch
    # sits at the same place, page-centre, regardless of what flanks it.
    # This also keeps rows narrower, which the round display needed --
    # 90%-wide rows were clipping the leading "V" of "Vibration" against
    # the bezel at this page's outer rows, confirmed on real hardware.
    - id: settings_page
      bg_color: 0x000000
      bg_opa: cover
      # scrollable: false and a tight pad_row -- six stacked children
      # (3 captions + 3 control clusters) at the theme's default row
      # gap overflowed the page's own height, which both pushed
      # Vibration's caption up into the bezel and made the page
      # scrollable (LVGL's default for any obj/page whose content
      # exceeds its bounds) when it should stay static like every
      # other page. Confirmed on real hardware.
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 8
      widgets:
        - label:
            text_color: 0xFFFFFF
            text: "Vibration"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 0
            pad_left: 0
            pad_right: 0
            pad_bottom: 2
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: settings_vibration_off_label
                  text_color: 0x00D9FF
                  text: "Off"
              - switch:
                  id: settings_vibration_switch
                  click_focusable: false
                  indicator:
                    checked:
                      bg_color: 0x00D9FF
                  on_value:
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - switch.turn_on: volcano_vibration
                        else:
                          - switch.turn_off: volcano_vibration
              - label:
                  id: settings_vibration_on_label
                  text_color: 0x888888
                  text: "On"
        - label:
            text_color: 0xFFFFFF
            text: "Display on Cooling"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 0
            pad_left: 0
            pad_right: 0
            pad_bottom: 2
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: settings_cooling_off_label
                  text_color: 0x00D9FF
                  text: "Off"
              - switch:
                  id: settings_display_on_cooling_switch
                  click_focusable: false
                  indicator:
                    checked:
                      bg_color: 0x00D9FF
                  on_value:
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - switch.turn_on: volcano_display_on_cooling
                        else:
                          - switch.turn_off: volcano_display_on_cooling
              - label:
                  id: settings_cooling_on_label
                  text_color: 0x888888
                  text: "On"
        - label:
            text_color: 0xFFFFFF
            text: "Units"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 0
            pad_left: 0
            pad_right: 0
            pad_bottom: 2
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: settings_units_c_label
                  text_color: 0x00D9FF
                  text: "°C"
              - switch:
                  id: settings_display_units_switch
                  click_focusable: false
                  indicator:
                    checked:
                      bg_color: 0x00D9FF
                  on_value:
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - switch.turn_on: volcano_display_units_fahrenheit
                        else:
                          - switch.turn_off: volcano_display_units_fahrenheit
              - label:
                  id: settings_units_f_label
                  text_color: 0x888888
                  text: "°F"

    # LED Brightness (ADR-0011's shared numeric-value page template, first
    # instance): rotary turn adjusts the value directly, same write-
    # coalescing debounce as Home's target temperature (see the
    # rotary_encoder sensor's on_value and commit_led_brightness/
    # refresh_led_brightness_label above). A button press returns to the
    # Menu via dial_button's existing else-branch -- this page is neither
    # home_page nor menu_page, so no change was needed there.
    #
    # Caption-then-value flex column, same as About/Diagnostics/Settings,
    # rather than Home's hand-placed y-offsets -- simpler and side-steps
    # the overlap bug Home's naive vertical stack hit originally. Caption
    # white, value/unit cyan, matching Settings' white-caption/cyan-
    # control convention. The heading gets extra pad_bottom on top of the
    # page's own pad_row, so it sits further from the value than the
    # value sits from the "%" below it.
    #
    # Step-size buttons (1/10, 48x48 fully round, same shape and orange
    # active colour as Home's Heat/Air): a straight 0-100 sweep at 1 per
    # detent is a lot of turning for a coarse change, so these pick how
    # much one detent adjusts pending_led_brightness by (led_brightness_
    # step, read in the rotary_encoder sensor's on_value above). Selected
    # step is orange, the other dim grey -- same active/inactive
    # convention as Home's actuator buttons, not Settings' cyan (these
    # are actions, not a state toggle). click_focusable: false plus the
    # on_boot group eviction above, same as Heat/Air -- these are real
    # button widgets, so they'd otherwise auto-join the
    # encoder's default group and eat a physical-button press meant for
    # something else.
    - id: led_brightness_page
      bg_color: 0x000000
      bg_opa: cover
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 8
      widgets:
        - label:
            text_color: 0xFFFFFF
            text: "LED Brightness"
            pad_bottom: 8
        - label:
            id: led_brightness_value_label
            text_font: font_temp
            text_color: 0x00D9FF
            text: "--"
        - label:
            text_color: 0x00D9FF
            text: "%"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            pad_top: 8
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 12
            widgets:
              - button:
                  id: led_brightness_step_1_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: 0xFF7A00
                  click_focusable: false
                  widgets:
                    - label:
                        text: "1"
                        align: center
                  on_click:
                    - globals.set:
                        id: led_brightness_step
                        value: "1.0"
                    - lvgl.widget.update:
                        id: led_brightness_step_1_button
                        bg_color: 0xFF7A00
                    - lvgl.widget.update:
                        id: led_brightness_step_10_button
                        bg_color: 0x333333
              - button:
                  id: led_brightness_step_10_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: 0x333333
                  click_focusable: false
                  widgets:
                    - label:
                        text: "10"
                        align: center
                  on_click:
                    - globals.set:
                        id: led_brightness_step
                        value: "10.0"
                    - lvgl.widget.update:
                        id: led_brightness_step_1_button
                        bg_color: 0x333333
                    - lvgl.widget.update:
                        id: led_brightness_step_10_button
                        bg_color: 0xFF7A00

    # Auto-Shutoff Duration (ADR-0011's shared numeric-value page
    # template, second instance) -- same shape as LED Brightness above,
    # just three step buttons (1/10/30) instead of two, since 1-360
    # minutes is a wider range than 0-100%. See LED Brightness's own
    # comment block above for the write-coalescing/group-eviction
    # reasoning this page follows identically.
    - id: auto_shutoff_duration_page
      bg_color: 0x000000
      bg_opa: cover
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 8
      widgets:
        - label:
            text_color: 0xFFFFFF
            text: "Auto-Shutoff Duration"
            pad_bottom: 8
        - label:
            id: auto_shutoff_duration_value_label
            text_font: font_temp
            text_color: 0x00D9FF
            text: "--"
        - label:
            text_color: 0x00D9FF
            text: "min"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            pad_top: 8
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 10
            widgets:
              - button:
                  id: auto_shutoff_duration_step_1_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: 0xFF7A00
                  click_focusable: false
                  widgets:
                    - label:
                        text: "1"
                        align: center
                  on_click:
                    - globals.set:
                        id: auto_shutoff_duration_step
                        value: "1.0"
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_1_button
                        bg_color: 0xFF7A00
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_10_button
                        bg_color: 0x333333
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_30_button
                        bg_color: 0x333333
              - button:
                  id: auto_shutoff_duration_step_10_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: 0x333333
                  click_focusable: false
                  widgets:
                    - label:
                        text: "10"
                        align: center
                  on_click:
                    - globals.set:
                        id: auto_shutoff_duration_step
                        value: "10.0"
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_1_button
                        bg_color: 0x333333
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_10_button
                        bg_color: 0xFF7A00
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_30_button
                        bg_color: 0x333333
              - button:
                  id: auto_shutoff_duration_step_30_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: 0x333333
                  click_focusable: false
                  widgets:
                    - label:
                        text: "30"
                        align: center
                  on_click:
                    - globals.set:
                        id: auto_shutoff_duration_step
                        value: "30.0"
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_1_button
                        bg_color: 0x333333
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_10_button
                        bg_color: 0x333333
                    - lvgl.widget.update:
                        id: auto_shutoff_duration_step_30_button
                        bg_color: 0xFF7A00

    # About and Diagnostics (ADR-0011's Information page, split in two --
    # read-only, so no on_load/on_click of their own: dial_button's
    # on_release already returns to the Menu from any page that isn't
    # Home or the Menu itself. A flex column layout stacks the labels
    # automatically, rather than hand-picking y offsets the way Home's
    # widgets needed to.
    # Each fact is a caption/value pair (cyan/white) rather than one
    # combined label, per feedback that a single "Label: value" line
    # read too plain.
    - id: about_page
      bg_color: 0x000000
      bg_opa: cover
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
      widgets:
        - label:
            text_color: 0x00D9FF
            text: "Product:"
        - label:
            id: about_product_line_value
            text_color: 0xFFFFFF
            text: "--"
        - label:
            text_color: 0x00D9FF
            text: "Dial FW:"
        - label:
            id: about_dial_firmware_value
            text_color: 0xFFFFFF
            # ESPHOME_PROJECT_VERSION comes from the esphome: project:
            # block above -- this firmware's own version, distinct from
            # the Volcano's own firmware/BLE firmware versions below.
            text: !lambda "return std::string(ESPHOME_PROJECT_VERSION);"
        - label:
            text_color: 0x00D9FF
            text: "Volcano FW:"
        - label:
            id: about_volcano_firmware_value
            text_color: 0xFFFFFF
            text: "--"
        - label:
            text_color: 0x00D9FF
            text: "BLE FW:"
        - label:
            id: about_volcano_ble_firmware_value
            text_color: 0xFFFFFF
            text: "--"
    - id: diagnostics_page
      bg_color: 0x000000
      bg_opa: cover
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
      widgets:
        - label:
            text_color: 0x00D9FF
            text: "Serial:"
        - label:
            id: diagnostics_serial_value
            text_color: 0xFFFFFF
            text: "--"
        - label:
            text_color: 0x00D9FF
            text: "Power:"
        - label:
            id: diagnostics_power_supply_value
            text_color: 0xFFFFFF
            text: "--"
        - label:
            text_color: 0x00D9FF
            text: "Time of Operation:"
        - label:
            id: diagnostics_time_of_operation_value
            text_color: 0xFFFFFF
            text: "--"
