# Phase 2 hardware bring-up for the M5Stack Dial (ADR-0010, ADR-0011).
# Confirms the board flashes and boots, that each of its four peripherals --
# display, touch, rotary encoder, physical button -- works, that the
# already-verified volcano component (ADR-0009) also connects and decodes
# state correctly on this different ESP32-S3 board, and that LVGL itself
# renders and accepts input from all three of touch/encoder/button on this
# hardware -- all checked individually against real hardware, retiring the
# one risk ADR-0010 flagged as unverified. Still no wifi/api/web_server --
# nothing here needs them yet. This is the confirmed foundation ADR-0011's
# actual UI (the Home page onward) builds on next, not the UI itself: the
# page below is a minimal input/render check, not part of that design.
#
# volcano's own [volcano] log tag reports connection lifecycle and decoded
# state on connect and on change, the same verification the Phase 1 dev
# board example relies on -- see examples/README.md. No entities are
# declared here since nothing yet consumes them (no web_server, no UI).
#
# The Dial is built on the M5StampS3 module (ESP32-S3, 8MB flash), matching
# the "M5Stack StampS3" PlatformIO board definition -- confirmed against the
# connected device's USB VID:PID (303A:1001).
#
# Each `on_*` handler below logs at DEBUG so `esphome logs` gives a direct,
# manual way to re-confirm a given peripheral still works, the same
# verification this file was built up against on real hardware.

esphome:
  name: volcano-dial-scaffold
  on_boot:
    then:
      - output.set_level:
          id: dial_backlight_pwm
          level: 100%

logger:

esp32:
  board: m5stack-stamps3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

ble_client:
  - mac_address: !secret volcano_mac_address
    id: volcano_ble_client

volcano:
  id: volcano_component
  ble_client_id: volcano_ble_client

# The GC9A01A round panel over SPI. Pins confirmed against a known-working
# community M5Dial configuration, not just the pinout reference --
# MOSI/SCK/CS/DC/RST as below; backlight is a separate PWM-driven pin
# (GPIO9) the panel stays dark without.
spi:
  mosi_pin: GPIO5
  clk_pin: GPIO6

output:
  - platform: ledc
    pin: GPIO9
    id: dial_backlight_pwm

display:
  - platform: ili9xxx
    id: dial_display
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    dimensions:
      width: 240
      height: 240
    auto_clear_enabled: false
    update_interval: never

# The FT3267 touch panel, which is FT5x06-register-compatible -- confirmed
# against the same known-working community M5Dial configuration the display
# pins were checked against.
i2c:
  sda: GPIO11
  scl: GPIO12

touchscreen:
  platform: ft5x06
  id: dial_touchscreen
  address: 0x38
  on_touch:
    - lambda: |-
        ESP_LOGD("main", "Touch at (%d, %d)", touch.x, touch.y);

# The rotary encoder (GPIO40/41, turn-only) and the separate physical
# button (GPIO42) that provides every "press" action in ADR-0011's
# navigation model -- the encoder itself has no click.
sensor:
  - platform: rotary_encoder
    name: "Dial Rotary Encoder"
    id: dial_rotary_encoder
    resolution: 1
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    on_value:
      - lambda: |-
          ESP_LOGD("main", "Encoder now at %d", (int) x);

binary_sensor:
  - platform: gpio
    name: "Dial Button"
    id: dial_button
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - logger.log: "Button pressed"
    on_release:
      - logger.log: "Button released"

# LVGL bring-up (ADR-0010): confirms the framework itself renders on this
# display and accepts input from both the touchscreen and the encoder/
# button pair, before any of ADR-0011's actual pages are built. The
# encoder's enter_button is the physical button, not the encoder's own
# click -- it has none.
lvgl:
  displays:
    - dial_display
  encoders:
    - sensor: dial_rotary_encoder
      enter_button: dial_button
  pages:
    - id: lvgl_bringup_page
      widgets:
        - label:
            id: lvgl_status_label
            text: "LVGL OK"
            align: center
        - button:
            id: lvgl_test_button
            align: bottom_mid
            y: -20
            width: 120
            height: 50
            widgets:
              - label:
                  text: "Tap/press"
            on_click:
              - lvgl.label.update:
                  id: lvgl_status_label
                  text: "Clicked!"
