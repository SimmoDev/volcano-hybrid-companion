# M5Stack Dial firmware, per ADR-0010/ADR-0011. Every ADR-0011 page is
# built and hardware-verified: Home (current/target temperature with
# rotary adjustment and write-coalescing debounce, a unit indicator that
# converts per ADR-0008, Heat/Air buttons, the auto-shutoff countdown,
# BLE/WiFi status icons), the Navigation Menu, Settings (vibration/
# display-on-cooling/display-units toggles), the shared rotary-adjusted
# numeric-value page (LED Brightness, Auto-Shutoff Duration, Dial
# Brightness -- Dial Brightness is the odd one out, local Dial hardware
# rather than a VolcanoDevice field, per that ADR's deliberate carve-out),
# Dial Sound (mutes the click/beep audio feedback below), and the split
# Information page -- About and Diagnostics, each its own menu entry.
#
# web_server is present too, matching the dev-board example exactly
# (same port/entity names/sorting weights), per ADR-0010's decision to
# retain it unchanged on the Dial firmware -- Phase 2 scope, not
# deferred to Phase 3 (Home Assistant/api integration specifically).
# Every volcano entity keeps driving its own LVGL widgets via its
# automation triggers; web_server exposure (name:/web_server: instead
# of internal: true) is additive, not a replacement for that. No api:
# block yet -- that's the Phase 3 concern, not this one.
#
# The Dial is built on the M5StampS3 module (ESP32-S3, 8MB flash), matching
# the "M5Stack StampS3" PlatformIO board definition -- confirmed against the
# connected device's USB VID:PID (303A:1001).
#
# Each `on_*` handler across the packages below logs at DEBUG so
# `esphome logs` gives a direct, manual way to re-confirm a given
# peripheral still works, the same verification this file was built up
# against on real hardware.
#
# Split into dial/*.yaml packages by concern -- hardware/peripherals,
# connectivity, shared state, the volcano: entities, the two physical
# inputs, the write-coalescing scripts, and one file per LVGL page --
# rather than one file covering all of it. Each package's own comments
# note where a cross-referenced piece of config now lives.

# Shared colour palette, echoing the Volcano's own display convention
# (orange for current/heat, cyan for target/selected) used throughout
# the pages below. Named here once rather than repeating each hex
# literal at every use site.
substitutions:
  cyan: "0x00D9FF"
  orange: "0xFF7A00"
  dark_grey: "0x333333"
  dim_grey: "0x888888"
  white: "0xFFFFFF"
  black: "0x000000"

packages:
  hardware: !include dial/hardware.yaml
  connectivity: !include dial/connectivity.yaml
  state: !include dial/state.yaml
  volcano_entities: !include dial/volcano-entities.yaml
  input: !include dial/input.yaml
  scripts: !include dial/scripts.yaml
  home_page: !include dial/home-page.yaml
  menu_page: !include dial/menu-page.yaml
  settings_page: !include dial/settings-page.yaml
  led_brightness_page: !include dial/led-brightness-page.yaml
  auto_shutoff_duration_page: !include dial/auto-shutoff-duration-page.yaml
  dial_brightness_page: !include dial/dial-brightness-page.yaml
  sound_page: !include dial/sound-page.yaml
  info_pages: !include dial/info-pages.yaml
