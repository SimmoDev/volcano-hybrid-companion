# M5Stack Dial firmware, per ADR-0010/ADR-0011. Every ADR-0011 page is
# built and hardware-verified: Home (current/target temperature with
# rotary adjustment and write-coalescing debounce, a unit indicator that
# converts per ADR-0008, Heat/Air buttons, the auto-shutoff countdown,
# BLE/WiFi status icons), the Navigation Menu, Connections (dial/
# connections-page.yaml -- BLE and WiFi status, each with a switch to
# release/reconnect it, letting a user hand the Volcano's BLE connection
# back to the official app without power-cycling the whole device, per
# ADR-0007's requirement that a control interface holding a persistent
# connection make releasing it discoverable), Settings (vibration/
# display-on-cooling/display-units toggles), the shared rotary-adjusted
# numeric-value page (LED Brightness, Auto-Shutoff Duration, Dial
# Brightness -- Dial Brightness is the odd one out, local Dial hardware
# rather than a VolcanoDevice field, per that ADR's deliberate carve-out),
# Dial Sound (mutes the click/beep audio feedback below), and the split
# Information page -- About and Diagnostics, each its own menu entry.
#
# web_server is present too, matching the dev-board example exactly
# (same port/entity names/sorting weights), per ADR-0010's decision to
# retain it unchanged on the Dial firmware -- Phase 2 scope, not
# deferred to Phase 3 (Home Assistant/api integration specifically).
# Every volcano entity keeps driving its own LVGL widgets via its
# automation triggers; web_server exposure (name:/web_server: instead
# of internal: true) is additive, not a replacement for that. No api:
# block yet -- that's the Phase 3 concern, not this one.
#
# The Dial is built on the M5StampS3 module (ESP32-S3, 8MB flash), matching
# the "M5Stack StampS3" PlatformIO board definition -- confirmed against the
# connected device's USB VID:PID (303A:1001).
#
# Each `on_*` handler across the packages below logs at DEBUG so
# `esphome logs` gives a direct, manual way to re-confirm a given
# peripheral still works, the same verification this file was built up
# against on real hardware.
#
# Split into dial/*.yaml packages by concern -- hardware/peripherals,
# connectivity, shared state, the volcano: entities, the two physical
# inputs, the write-coalescing scripts, and one file per LVGL page --
# rather than one file covering all of it. Each package's own comments
# note where a cross-referenced piece of config now lives.

# Shared colour palette, echoing the Volcano's own display convention
# (orange for current/heat, cyan for target/selected) used throughout
# the pages below. Named here once rather than repeating each hex
# literal at every use site.
substitutions:
  cyan: "0x00D9FF"
  orange: "0xFF7A00"
  dark_grey: "0x333333"
  dim_grey: "0x888888"
  white: "0xFFFFFF"
  black: "0x000000"

packages:
  hardware: !include dial/hardware.yaml
  connectivity: !include dial/connectivity.yaml
  state: !include dial/state.yaml
  volcano_entities: !include dial/volcano-entities.yaml
  input: !include dial/input.yaml
  scripts: !include dial/scripts.yaml
  home_page: !include dial/home-page.yaml
  connections_page: !include dial/connections-page.yaml
  menu_page: !include dial/menu-page.yaml
  settings_page: !include dial/settings-page.yaml
  # The three numeric-value pages are one shared template
  # (dial/numeric-value-page.yaml), instantiated here with each page's
  # own ids/text/behaviour -- see that file's own comment for what's
  # templated and what's deliberately still spelled out per instance.
  led_brightness_page: !include
    file: dial/numeric-value-page.yaml
    vars:
      page_id: led_brightness_page
      caption: LED Brightness
      unit_text: "%"
      value_label_id: led_brightness_value_label
      pending_id: pending_led_brightness
      pending_initial_value: "NAN"
      step_id: led_brightness_step
      step_buttons_pad_column: 12
      commit_script_id: commit_led_brightness
      refresh_script_id: refresh_led_brightness_label
      commit_actions:
        - delay: 300ms
        - if:
            condition:
              lambda: "return !std::isnan(id(pending_led_brightness));"
            then:
              - number.set:
                  id: volcano_led_brightness
                  value: !lambda "return id(pending_led_brightness);"
      refresh_text_lambda: |-
        float v = id(pending_led_brightness);
        if (std::isnan(v))
          return std::string("--");
        char buf[8];
        snprintf(buf, sizeof(buf), "%.0f", v);
        return std::string(buf);
      # Resync from the confirmed value on entry (CHAR-015 has no notify,
      # so a dropped write is otherwise only corrected by a fresh user
      # turn). Skipped while commit_led_brightness is mid-debounce, so a
      # turn made just before leaving the page isn't discarded on return.
      # Stays NaN -- "--" -- until the first device report.
      on_load_actions:
        - if:
            condition:
              not:
                script.is_running: commit_led_brightness
            then:
              - lambda: |-
                  if (!std::isnan(id(volcano_led_brightness).state))
                    id(pending_led_brightness) = id(volcano_led_brightness).state;
              - script.execute: refresh_led_brightness_label
      step_buttons:
        - button:
            id: led_brightness_step_1_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${orange}
            click_focusable: false
            widgets:
              - label:
                  text: "1"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: led_brightness_step
                  value: "1.0"
              - lvgl.widget.update:
                  id: led_brightness_step_1_button
                  bg_color: ${orange}
              - lvgl.widget.update:
                  id: led_brightness_step_10_button
                  bg_color: ${dark_grey}
        - button:
            id: led_brightness_step_10_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${dark_grey}
            click_focusable: false
            widgets:
              - label:
                  text: "10"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: led_brightness_step
                  value: "10.0"
              - lvgl.widget.update:
                  id: led_brightness_step_1_button
                  bg_color: ${dark_grey}
              - lvgl.widget.update:
                  id: led_brightness_step_10_button
                  bg_color: ${orange}
  auto_shutoff_duration_page: !include
    file: dial/numeric-value-page.yaml
    vars:
      page_id: auto_shutoff_duration_page
      caption: Auto-Shutoff Duration
      unit_text: min
      value_label_id: auto_shutoff_duration_value_label
      pending_id: pending_auto_shutoff_duration_min
      pending_initial_value: "NAN"
      step_id: auto_shutoff_duration_step
      step_buttons_pad_column: 10
      commit_script_id: commit_auto_shutoff_duration
      refresh_script_id: refresh_auto_shutoff_duration_label
      commit_actions:
        - delay: 300ms
        - if:
            condition:
              lambda: "return !std::isnan(id(pending_auto_shutoff_duration_min));"
            then:
              - number.set:
                  id: volcano_auto_shutoff_duration
                  value: !lambda "return id(pending_auto_shutoff_duration_min);"
      refresh_text_lambda: |-
        float v = id(pending_auto_shutoff_duration_min);
        if (std::isnan(v))
          return std::string("--");
        char buf[8];
        snprintf(buf, sizeof(buf), "%.0f", v);
        return std::string(buf);
      # Resync from the confirmed value on entry (CHAR-017 has no notify,
      # so a dropped write is otherwise only corrected by a fresh user
      # turn). Skipped while commit_auto_shutoff_duration is mid-debounce,
      # so a turn made just before leaving the page isn't discarded on
      # return. Stays NaN -- "--" -- until the first device report.
      on_load_actions:
        - if:
            condition:
              not:
                script.is_running: commit_auto_shutoff_duration
            then:
              - lambda: |-
                  if (!std::isnan(id(volcano_auto_shutoff_duration).state))
                    id(pending_auto_shutoff_duration_min) = id(volcano_auto_shutoff_duration).state;
              - script.execute: refresh_auto_shutoff_duration_label
      step_buttons:
        - button:
            id: auto_shutoff_duration_step_1_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${orange}
            click_focusable: false
            widgets:
              - label:
                  text: "1"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: auto_shutoff_duration_step
                  value: "1.0"
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_1_button
                  bg_color: ${orange}
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_10_button
                  bg_color: ${dark_grey}
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_30_button
                  bg_color: ${dark_grey}
        - button:
            id: auto_shutoff_duration_step_10_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${dark_grey}
            click_focusable: false
            widgets:
              - label:
                  text: "10"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: auto_shutoff_duration_step
                  value: "10.0"
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_1_button
                  bg_color: ${dark_grey}
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_10_button
                  bg_color: ${orange}
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_30_button
                  bg_color: ${dark_grey}
        - button:
            id: auto_shutoff_duration_step_30_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${dark_grey}
            click_focusable: false
            widgets:
              - label:
                  text: "30"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: auto_shutoff_duration_step
                  value: "30.0"
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_1_button
                  bg_color: ${dark_grey}
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_10_button
                  bg_color: ${dark_grey}
              - lvgl.widget.update:
                  id: auto_shutoff_duration_step_30_button
                  bg_color: ${orange}
  # Dial Brightness is *not* a VolcanoDevice field -- it's the Dial's
  # own backlight, read/written directly against ESPHome's output
  # component and persisted via a restore_value global
  # (dial_brightness_pct, dial/state.yaml) rather than anything flowing
  # through the Volcano abstraction layer (ADR-0002's boundary is why
  # this isn't a volcano: number entity even though it reuses the same
  # page template). commit_actions has no NaN guard, unlike the two
  # above -- pending_dial_brightness is always a real number by the
  # time this page could ever be showing (seeded from the persisted
  # dial_brightness_pct in dial/hardware.yaml's on_boot), since nothing
  # async has to report it first the way a VolcanoDevice field does.
  # 1-100%, clamped at 1 rather than 0 (dial/input.yaml's rotary
  # dispatch) so the backlight can never be turned fully off from here.
  dial_brightness_page: !include
    file: dial/numeric-value-page.yaml
    vars:
      page_id: dial_brightness_page
      caption: Dial Brightness
      unit_text: "%"
      value_label_id: dial_brightness_value_label
      pending_id: pending_dial_brightness
      pending_initial_value: "100"
      step_id: dial_brightness_step
      step_buttons_pad_column: 12
      commit_script_id: commit_dial_brightness
      refresh_script_id: refresh_dial_brightness_label
      commit_actions:
        - delay: 300ms
        - globals.set:
            id: dial_brightness_pct
            value: !lambda "return id(pending_dial_brightness);"
        - output.set_level:
            id: dial_backlight_pwm
            level: !lambda "return id(pending_dial_brightness) / 100.0f;"
      refresh_text_lambda: |-
        char buf[8];
        snprintf(buf, sizeof(buf), "%.0f", id(pending_dial_brightness));
        return std::string(buf);
      # No on-entry resync: unlike the two VolcanoDevice pages, this page's
      # commit is a local globals.set/output.set_level that cannot be
      # dropped, so pending_dial_brightness and dial_brightness_pct never
      # diverge in a way an entry would need to correct.
      on_load_actions: []
      step_buttons:
        - button:
            id: dial_brightness_step_1_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${orange}
            click_focusable: false
            widgets:
              - label:
                  text: "1"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: dial_brightness_step
                  value: "1.0"
              - lvgl.widget.update:
                  id: dial_brightness_step_1_button
                  bg_color: ${orange}
              - lvgl.widget.update:
                  id: dial_brightness_step_10_button
                  bg_color: ${dark_grey}
        - button:
            id: dial_brightness_step_10_button
            width: 48
            height: 48
            radius: circle
            shadow_width: 0
            outline_width: 0
            bg_color: ${dark_grey}
            click_focusable: false
            widgets:
              - label:
                  text: "10"
                  align: center
            on_click:
              - rtttl.play: "beep:d=16,o=5,b=160:c,e"
              - globals.set:
                  id: dial_brightness_step
                  value: "10.0"
              - lvgl.widget.update:
                  id: dial_brightness_step_1_button
                  bg_color: ${dark_grey}
              - lvgl.widget.update:
                  id: dial_brightness_step_10_button
                  bg_color: ${orange}
  sound_page: !include dial/sound-page.yaml
  info_pages: !include dial/info-pages.yaml
