# Tracks whether the BLE link is up but volcano is not yet READY, so
# dial/connectivity.yaml's 500ms interval can blink the BLE icon while
# CONNECTING. ble_blink_on is that interval's own toggle state, not read
# anywhere else.
#
# pending_target_temp_c is the Home page's own local notion of the target
# temperature (ADR-0011's write-coalescing): the encoder adjusts it and the
# label always renders it immediately, but VolcanoDevice only hears about
# it once commit_target_temperature's debounce settles. Every confirmed
# report from the device re-seeds it too, so an external change (the
# Volcano's own panel, say) is reflected the same way a local turn is.
# NaN until the first real report -- the encoder is a no-op until then,
# rather than adjusting from a meaningless baseline. last_encoder_raw is
# the rotary_encoder sensor's own running count, needed only to compute
# each turn's delta.
#
# The LED Brightness/Auto-Shutoff Duration/Dial Brightness pages' own
# pending_*/​*_step pairs come from dial/numeric-value-page.yaml's
# template instead of being declared here -- see that file and each
# page's own !include vars in m5stack-dial-minimal.yaml.
globals:
  - id: ble_connecting
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_blink_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pending_target_temp_c
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: last_encoder_raw
    type: float
    restore_value: false
    initial_value: "0"
  # Dial Brightness (ADR-0011): local Dial hardware, not a VolcanoDevice
  # field, so this is a plain restore_value global rather than a
  # volcano: number entity -- ESPHome's own preference/NVS facilities
  # persist it across reboots. dial_brightness_pct is the confirmed,
  # persisted value the PWM output and a fresh boot both read from; the
  # page's own pending_dial_brightness (same write-coalescing shape as
  # every other rotary-adjusted page) comes from the numeric-value-page
  # template above, seeded from this in dial/hardware.yaml's on_boot
  # (see that comment) since nothing else here is unique to Dial
  # Brightness the way this persisted value is.
  - id: dial_brightness_pct
    type: float
    restore_value: true
    initial_value: "100"
  # Dial Sound (ADR-0011): local Dial hardware, not a VolcanoDevice
  # field, same carve-out as Dial Brightness above -- but a plain bool,
  # not a percentage, since this buzzer has no true amplitude control
  # (see dial/hardware.yaml's on_boot comment) and mute/unmute is the
  # most this hardware can honestly offer.
  - id: dial_sound_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  # Connections page (dial/connections-page.yaml): the Dial's own record
  # of whether the user has switched BLE/WiFi off from that page. Neither
  # ble_client nor wifi expose a queryable "am I enabled" value of their
  # own (confirmed by reading both components' source -- ble_client::
  # BLEClient::enabled is a plain public field, not an entity; wifi has
  # no equivalent at all), so this is the Dial's own mirror, not a
  # read-back -- kept in sync because the Connections page's own switches
  # are the only thing that ever sets it. Neither survives a reboot: both
  # ble_client and wifi always start enabled (confirmed by reading their
  # setup()/enable_on_boot handling), so restoring a
  # previous "off" here would desync this global from what the underlying
  # component actually does at boot.
  - id: ble_enabled
    type: bool
    restore_value: false
    initial_value: "true"
  - id: wifi_enabled
    type: bool
    restore_value: false
    initial_value: "true"
