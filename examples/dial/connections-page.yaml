# The Connections page (see ADR-0011's own Notes, and ADR-0012 for the
# Home Assistant row). BLE and WiFi connection status, each with a switch
# to release/reconnect it, plus a read-only Home Assistant status line --
# all independent of each other and of the Volcano's own state.
#
# The BLE switch is what lets a user hand the Volcano's connection back
# to the official Storz & Bickel app without power-cycling the whole
# Dial, per ADR-0007's requirement that a control interface holding a
# persistent connection make releasing it discoverable. Turning it off
# releases the connection and suspends reconnection until switched back
# on (see dial/connectivity.yaml's own comment on how); per ADR-0007's
# CONN-003 note, the disconnected status text is "Disconnected - in
# use?" -- the trailing question rather than a flat "Disconnected"
# because a disconnected controller can't tell a device that's in use
# by the official app from one that's simply absent.
#
# The WiFi switch is mainly for testing that the Dial genuinely needs
# neither connection, per ADR-0001's Phase 2 "no external dependencies"
# requirement -- toggling it doesn't touch BLE or the Volcano at all, and
# it deliberately has no third "connecting" status, the same scope call
# the Home page's own WiFi icon already makes.
#
# The Home Assistant line is indicator only -- ADR-0012 gives it no
# switch (nothing about the api connection needs on-device control) and
# no Home-page icon (ADR-0012 scopes the indicator to this page). It
# just reports whether an api client is currently connected.
#
# Same caption/status layout technique as Settings (flex column,
# scrollable: false, tight pad_row) -- eight stacked groups now: BLE and
# WiFi are caption+status+switch-row (three each), Home Assistant is
# caption+status only. Two groups past the six Settings proved fit, so
# the BLE status text was cut to one short line to claw a line back
# ("Disconnected - in use?" -- a longer string clips against the round
# edge at that near-the-top row). All eight clearing the display without
# clipping was verified on real hardware, and stays a hardware check for
# any further change here.
#
# refresh_ble_connection_status/refresh_ble_switch_labels/
# refresh_wifi_switch_labels/refresh_ha_connection_status
# (dial/scripts.yaml) keep this page's status text/colours -- and the
# Home page's small BLE/WiFi icons -- in sync from one place, since
# those surfaces render the same underlying state. They run on every
# connection event and once on page load (on_load below), so an event
# that landed before this page's widgets existed can't leave a row
# showing stale text.
lvgl:
  pages:
    - id: connections_page
      bg_color: ${black}
      bg_opa: cover
      scrollable: false
      on_load:
        - script.execute: refresh_ble_connection_status
        - script.execute: refresh_ble_switch_labels
        - script.execute: refresh_wifi_switch_labels
        - script.execute: refresh_ha_connection_status
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 6
      widgets:
        - label:
            text_color: ${cyan}
            text: "BLE"
        - label:
            id: connections_ble_status_label
            text_color: 0xCC0000
            text_align: center
            long_mode: wrap
            width: 90%
            text: "Disconnected"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 2
            pad_left: 0
            pad_right: 0
            pad_bottom: 2
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: connections_ble_off_label
                  text_color: ${dim_grey}
                  text: "Off"
              - switch:
                  id: connections_ble_switch
                  click_focusable: false
                  state:
                    checked: true
                  indicator:
                    checked:
                      bg_color: ${cyan}
                  # Off releases the BLE connection and suspends
                  # reconnection; on reconnects. Matches the device's own
                  # actual default (ble_client always starts enabled), so
                  # this switch's own state: checked: true above and
                  # ble_enabled's initial_value ("true", dial/state.yaml)
                  # agree without needing an on_boot correction.
                  on_value:
                    - rtttl.play: "beep:d=16,o=5,b=160:c,e"
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - globals.set:
                              id: ble_enabled
                              value: "true"
                          - lambda: "id(volcano_ble_client).set_enabled(true);"
                        else:
                          - globals.set:
                              id: ble_enabled
                              value: "false"
                          - lambda: "id(volcano_ble_client).set_enabled(false);"
                    - script.execute: refresh_ble_connection_status
                    - script.execute: refresh_ble_switch_labels
              - label:
                  id: connections_ble_on_label
                  text_color: ${cyan}
                  text: "On"
        - label:
            text_color: ${cyan}
            text: "WiFi"
            pad_top: 4
        - label:
            id: connections_wifi_status_label
            text_color: 0xCC0000
            text: "Disconnected"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 2
            pad_left: 0
            pad_right: 0
            pad_bottom: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: connections_wifi_off_label
                  text_color: ${dim_grey}
                  text: "Off"
              - switch:
                  id: connections_wifi_switch
                  click_focusable: false
                  state:
                    checked: true
                  indicator:
                    checked:
                      bg_color: ${cyan}
                  # No read-back to wait for here, unlike BLE -- wifi.enable/
                  # wifi.disable are synchronous actions, so the status text
                  # is set directly rather than through a computed script;
                  # WiFi has only these three states to represent, not BLE's
                  # four, so a shared script would just be indirection here.
                  # Leaves wifi_status_icon (the Home page's own icon)
                  # alone: "Off" reading there as just another disconnected
                  # state is the same scope call the BLE icon already makes.
                  # dial/connectivity.yaml's on_connect/on_disconnect
                  # triggers own that icon's colour anyway, and disabling
                  # WiFi still reaches on_disconnect.
                  on_value:
                    - rtttl.play: "beep:d=16,o=5,b=160:c,e"
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - globals.set:
                              id: wifi_enabled
                              value: "true"
                          - wifi.enable
                          - lvgl.label.update:
                              id: connections_wifi_status_label
                              text_color: 0xCC0000
                              text: "Disconnected"
                        else:
                          - globals.set:
                              id: wifi_enabled
                              value: "false"
                          - wifi.disable
                          - lvgl.label.update:
                              id: connections_wifi_status_label
                              text_color: ${dim_grey}
                              text: "Off"
                    - script.execute: refresh_wifi_switch_labels
              - label:
                  id: connections_wifi_on_label
                  text_color: ${cyan}
                  text: "On"
        # Home Assistant: caption + status only, no switch row (ADR-0012).
        # The static text/colour here is the pre-connect default; the api
        # component's on_client_connected/on_client_disconnected triggers
        # (dial/connectivity.yaml) drive it live via
        # refresh_ha_connection_status. Short one-line text either way, so
        # no long_mode: wrap / width like the BLE status label needs.
        #
        # The caption stays "Home Assistant" for user recognition even
        # though the line actually tracks any api client -- an `esphome
        # logs` session counts too. ESPHome exposes no per-client identity
        # to filter on; see refresh_ha_connection_status's own comment.
        - label:
            text_color: ${cyan}
            text: "Home Assistant"
            pad_top: 4
        - label:
            id: connections_ha_status_label
            text_color: 0xCC0000
            text: "Disconnected"
