# The Connections page (see ADR-0011's own Notes). BLE and WiFi
# connection status, each with a switch to release/reconnect it,
# independently of the other and of the Volcano's own state.
#
# The BLE switch is what lets a user hand the Volcano's connection back
# to the official Storz & Bickel app without power-cycling the whole
# Dial, per ADR-0007's requirement that a control interface holding a
# persistent connection make releasing it discoverable. Turning it off
# releases the connection and suspends reconnection until switched back
# on (see dial/connectivity.yaml's own comment on how); per ADR-0007's
# CONN-003 note, the status text says "may be in use elsewhere" rather
# than implying the device is absent, since a disconnected controller
# can't tell the two apart.
#
# The WiFi switch is mainly for testing that the Dial genuinely needs
# neither connection, per ADR-0001's Phase 2 "no external dependencies"
# requirement -- toggling it doesn't touch BLE or the Volcano at all, and
# it deliberately has no third "connecting" status, the same scope call
# the Home page's own WiFi icon already makes.
#
# Same caption/status/switch-row layout technique as Settings (flex
# column, scrollable: false, tight pad_row) -- six stacked groups here
# too (2 sections x caption+status+switch-row), the same budget Settings
# already proved fits the round display without scrolling or clipping.
#
# refresh_ble_connection_status/refresh_ble_switch_labels/
# refresh_wifi_switch_labels (dial/scripts.yaml) keep this page's status
# text/colours and the Home page's small BLE/WiFi icons in sync from one
# place, since both surfaces render the same underlying state.
lvgl:
  pages:
    - id: connections_page
      bg_color: ${black}
      bg_opa: cover
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 6
      widgets:
        - label:
            text_color: ${cyan}
            text: "BLE"
        - label:
            id: connections_ble_status_label
            text_color: 0xCC0000
            text_align: center
            long_mode: wrap
            width: 90%
            text: "Disconnected"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 2
            pad_left: 0
            pad_right: 0
            pad_bottom: 2
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: connections_ble_off_label
                  text_color: ${dim_grey}
                  text: "Off"
              - switch:
                  id: connections_ble_switch
                  click_focusable: false
                  state:
                    checked: true
                  indicator:
                    checked:
                      bg_color: ${cyan}
                  # Off releases the BLE connection and suspends
                  # reconnection; on reconnects. Matches the device's own
                  # actual default (ble_client always starts enabled), so
                  # this switch's own state: checked: true above and
                  # ble_enabled's initial_value ("true", dial/state.yaml)
                  # agree without needing an on_boot correction.
                  on_value:
                    - rtttl.play: "beep:d=16,o=5,b=160:c,e"
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - globals.set:
                              id: ble_enabled
                              value: "true"
                          - lambda: "id(volcano_ble_client).set_enabled(true);"
                        else:
                          - globals.set:
                              id: ble_enabled
                              value: "false"
                          - lambda: "id(volcano_ble_client).set_enabled(false);"
                    - script.execute: refresh_ble_connection_status
                    - script.execute: refresh_ble_switch_labels
              - label:
                  id: connections_ble_on_label
                  text_color: ${cyan}
                  text: "On"
        - label:
            text_color: ${cyan}
            text: "WiFi"
            pad_top: 4
        - label:
            id: connections_wifi_status_label
            text_color: 0xCC0000
            text: "Disconnected"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_top: 2
            pad_left: 0
            pad_right: 0
            pad_bottom: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 8
            widgets:
              - label:
                  id: connections_wifi_off_label
                  text_color: ${dim_grey}
                  text: "Off"
              - switch:
                  id: connections_wifi_switch
                  click_focusable: false
                  state:
                    checked: true
                  indicator:
                    checked:
                      bg_color: ${cyan}
                  # No read-back to wait for here, unlike BLE -- wifi.enable/
                  # wifi.disable are synchronous actions, so the status text
                  # is set directly rather than through a computed script;
                  # WiFi has only these three states to represent, not BLE's
                  # four, so a shared script would just be indirection here.
                  # Leaves wifi_status_icon (the Home page's own icon) alone,
                  # the same "Off" reads as "disconnected" there call the BLE
                  # icon already makes -- dial/connectivity.yaml's existing
                  # on_connect/on_disconnect triggers are what own its
                  # colour, and disabling WiFi still reaches on_disconnect.
                  on_value:
                    - rtttl.play: "beep:d=16,o=5,b=160:c,e"
                    - if:
                        condition:
                          lambda: "return x;"
                        then:
                          - globals.set:
                              id: wifi_enabled
                              value: "true"
                          - wifi.enable
                          - lvgl.label.update:
                              id: connections_wifi_status_label
                              text_color: 0xCC0000
                              text: "Disconnected"
                        else:
                          - globals.set:
                              id: wifi_enabled
                              value: "false"
                          - wifi.disable
                          - lvgl.label.update:
                              id: connections_wifi_status_label
                              text_color: ${dim_grey}
                              text: "Off"
                    - script.execute: refresh_wifi_switch_labels
              - label:
                  id: connections_wifi_on_label
                  text_color: ${cyan}
                  text: "On"
