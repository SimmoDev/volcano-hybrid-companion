lvgl:
  pages:
    # Dial Brightness (ADR-0011's shared numeric-value page template,
    # third and final instance): same shape as LED Brightness (1-100%,
    # clamped at 1 rather than 0 so the backlight can never be turned
    # fully off from here -- 0% would make the page itself unreadable to
    # turn back up -- so the same two step buttons, 1/10), but this is
    # *not* a VolcanoDevice field -- it's the Dial's own backlight,
    # read/written directly against ESPHome's output component and
    # persisted via a restore_value global (dial_brightness_pct) rather
    # than anything flowing through the Volcano abstraction layer. See
    # the comments on dial_brightness_pct/pending_dial_brightness
    # (dial/state.yaml) and commit_dial_brightness/refresh_dial_
    # brightness_label (dial/scripts.yaml) for the mechanism; ADR-0002's
    # boundary is why this isn't a volcano: number entity even though it
    # reuses the same page template.
    - id: dial_brightness_page
      bg_color: ${black}
      bg_opa: cover
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 8
      widgets:
        - label:
            text_color: ${white}
            text: "Dial Brightness"
            pad_bottom: 8
        - label:
            id: dial_brightness_value_label
            text_font: font_temp
            text_color: ${cyan}
            text: "--"
        - label:
            text_color: ${cyan}
            text: "%"
        - obj:
            width: size_content
            height: size_content
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            pad_top: 8
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 12
            widgets:
              - button:
                  id: dial_brightness_step_1_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: ${orange}
                  click_focusable: false
                  widgets:
                    - label:
                        text: "1"
                        align: center
                  on_click:
                    - rtttl.play: "beep:d=16,o=5,b=160:c,e"
                    - globals.set:
                        id: dial_brightness_step
                        value: "1.0"
                    - lvgl.widget.update:
                        id: dial_brightness_step_1_button
                        bg_color: ${orange}
                    - lvgl.widget.update:
                        id: dial_brightness_step_10_button
                        bg_color: ${dark_grey}
              - button:
                  id: dial_brightness_step_10_button
                  width: 48
                  height: 48
                  radius: circle
                  shadow_width: 0
                  outline_width: 0
                  bg_color: ${dark_grey}
                  click_focusable: false
                  widgets:
                    - label:
                        text: "10"
                        align: center
                  on_click:
                    - rtttl.play: "beep:d=16,o=5,b=160:c,e"
                    - globals.set:
                        id: dial_brightness_step
                        value: "10.0"
                    - lvgl.widget.update:
                        id: dial_brightness_step_1_button
                        bg_color: ${dark_grey}
                    - lvgl.widget.update:
                        id: dial_brightness_step_10_button
                        bg_color: ${orange}

