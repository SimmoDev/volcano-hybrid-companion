# Shared by both temperature entities' on_value and by
# display_units_fahrenheit's on_turn_on/on_turn_off (ADR-0008: the component
# always reports Celsius, so a unit change re-renders the last known value
# rather than waiting for the device's next report). Kept as two scripts,
# not one parameterised by which label/sensor to use, since ESPHome's YAML
# automations have no clean way to pass that in -- duplicating this much
# is simpler than the indirection needed to avoid it.
script:
  - id: refresh_current_temp_label
    then:
      - lvgl.label.update:
          id: current_temp_label
          text: !lambda |-
            float c = id(volcano_current_temperature).state;
            if (std::isnan(c))
              return std::string("--");
            float v = id(volcano_display_units_fahrenheit).state ? (c * 9.0f / 5.0f + 32.0f) : c;
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # ADR-0011's write-coalescing: fires 300ms after the encoder last
  # moved (mode: restart cancels and restarts the delay on every new
  # turn), not once per detent. VolcanoDevice refuses a second write to
  # a field while one is already outstanding (ADR-0009) and a confirmed
  # round trip is ~150-250ms on real hardware -- writing on every detent
  # would silently drop most of them. Guarded against a stale NaN
  # baseline; VolcanoBleClient's own range check would refuse it anyway,
  # but this avoids attempting a meaningless write in the first place.
  - id: commit_target_temperature
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: "return !std::isnan(id(pending_target_temp_c));"
          then:
            - number.set:
                id: volcano_target_temperature
                value: !lambda "return id(pending_target_temp_c);"
  # Reads pending_target_temp_c, not volcano_target_temperature.state --
  # this is the label a rotary turn updates immediately, before
  # commit_target_temperature's debounced write even fires, let alone
  # confirms.
  - id: refresh_target_temp_label
    then:
      - lvgl.label.update:
          id: target_temp_label
          text: !lambda |-
            float c = id(pending_target_temp_c);
            if (std::isnan(c))
              return std::string("--");
            float v = id(volcano_display_units_fahrenheit).state ? (c * 9.0f / 5.0f + 32.0f) : c;
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # LED Brightness's, Auto-Shutoff Duration's and Dial Brightness's own
  # commit/refresh pairs -- same shape as commit_target_temperature/
  # refresh_target_temp_label above, but generated from
  # dial/numeric-value-page.yaml's shared template (see that file and
  # each page's own !include vars in m5stack-dial-minimal.yaml) rather
  # than declared here, since they're one part of that page template,
  # not a standalone script.
  # Dial Sound's flank-label colours (Off/On, same active-cyan/inactive-grey
  # convention as Settings' toggles) -- shared between dial/hardware.yaml's
  # on_boot (so the restored dial_sound_enabled value is reflected
  # immediately) and dial/sound-page.yaml's own switch on_value, rather
  # than duplicating the two lvgl.label.update calls in both places.
  - id: refresh_sound_labels
    then:
      - lvgl.label.update:
          id: sound_off_label
          text_color: !lambda "return id(dial_sound_enabled) ? lv_color_hex(0x888888) : lv_color_hex(0x00D9FF);"
      - lvgl.label.update:
          id: sound_on_label
          text_color: !lambda "return id(dial_sound_enabled) ? lv_color_hex(0x00D9FF) : lv_color_hex(0x888888);"
  # Computes BLE's status for two different surfaces from the same three
  # inputs -- ble_enabled (the Connections page's own switch),
  # volcano_connected (READY, per ADR-0009) and ble_connecting (the
  # link-up-but-not-READY window dial/connectivity.yaml's blink interval
  # also watches). The Home page's small icon deliberately keeps ADR-0011's
  # original three-state palette (steady green/flashing orange/red) rather
  # than gaining a fourth "off" colour of its own -- there's no room next
  # to it to explain what a new colour would mean, and "released" reads to
  # a glance at Home as just another way of being disconnected. The
  # Connections page's own status label is where that distinction actually
  # belongs, since it has room to say "Off" in words. Called from every
  # site that can change one of the three inputs: dial/connectivity.yaml's
  # ble_client on_connect/on_disconnect, dial/volcano-entities.yaml's
  # connected on_press/on_release, and this page's own switch. The blink
  # interval still owns alternating the Home icon's colour once this
  # script has set it to a steady orange for the Connecting case -- it
  # only acts while ble_connecting is true, so it doesn't fight the steady
  # colours this script sets for the other states.
  - id: refresh_ble_connection_status
    then:
      - lvgl.label.update:
          id: ble_status_icon
          text_color: !lambda |-
            if (id(volcano_connected).state)
              return lv_color_hex(0x00CC44);
            if (id(ble_connecting))
              return lv_color_hex(0xFFA500);
            return lv_color_hex(0xCC0000);
      - lvgl.label.update:
          id: connections_ble_status_label
          text_color: !lambda |-
            if (!id(ble_enabled))
              return lv_color_hex(0x888888);
            if (id(volcano_connected).state)
              return lv_color_hex(0x00CC44);
            if (id(ble_connecting))
              return lv_color_hex(0xFFA500);
            return lv_color_hex(0xCC0000);
          text: !lambda |-
            if (!id(ble_enabled))
              return std::string("Off");
            if (id(volcano_connected).state)
              return std::string("Connected");
            if (id(ble_connecting))
              return std::string("Connecting...");
            return std::string("Disconnected -- may be in use elsewhere");
  # The Connections page's own Off/On flanking-label colours for each
  # switch, same active-cyan/inactive-grey convention as Settings/Dial
  # Sound -- kept separate from refresh_ble_connection_status above since
  # that one also drives the Home page icon, which has no flanking labels
  # of its own.
  - id: refresh_ble_switch_labels
    then:
      - lvgl.label.update:
          id: connections_ble_off_label
          text_color: !lambda "return id(ble_enabled) ? lv_color_hex(0x888888) : lv_color_hex(0x00D9FF);"
      - lvgl.label.update:
          id: connections_ble_on_label
          text_color: !lambda "return id(ble_enabled) ? lv_color_hex(0x00D9FF) : lv_color_hex(0x888888);"
  - id: refresh_wifi_switch_labels
    then:
      - lvgl.label.update:
          id: connections_wifi_off_label
          text_color: !lambda "return id(wifi_enabled) ? lv_color_hex(0x888888) : lv_color_hex(0x00D9FF);"
      - lvgl.label.update:
          id: connections_wifi_on_label
          text_color: !lambda "return id(wifi_enabled) ? lv_color_hex(0x00D9FF) : lv_color_hex(0x888888);"
  - id: refresh_time_of_operation_label
    then:
      - lvgl.label.update:
          id: diagnostics_time_of_operation_value
          text: !lambda |-
            float h = id(volcano_hours_of_operation).state;
            float m = id(volcano_minutes_of_operation).state;
            if (std::isnan(h) || std::isnan(m))
              return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0fh %.0fm", h, m);
            return std::string(buf);
  # Shared by both the roller's on_click (touch, guarded to POINTER
  # there) and dial_button's on_release (button, on the Menu page) --
  # one place to add a branch when a new page/option is added, rather
  # than keeping the touch and button paths in sync by hand.
  #
  # Dispatches on get_selected_index()'s numeric index rather than
  # get_selected_text(): dial/menu-page.yaml's roller options: list is
  # the single source of truth for both the displayed label and its
  # index, so renaming/rewording an option can't silently desync it
  # from this dispatch the way a duplicated exact-string comparison
  # could -- a typo or rewrite would simply select a different, wrong
  # index rather than falling through unnoticed to the final else. The
  # index below must still match the options: list order.
  - id: confirm_menu_selection
    then:
      - lambda: |-
          ESP_LOGD("main", "Menu confirmed: %s", id(nav_menu_roller).get_selected_text().c_str());
      - if:
          condition:
            lambda: "return id(nav_menu_roller).get_selected_index() == 0;"  # Home
          then:
            - lvgl.page.show: home_page
          else:
            - if:
                condition:
                  lambda: "return id(nav_menu_roller).get_selected_index() == 1;"  # Connections
                then:
                  - lvgl.page.show: connections_page
                else:
                  - if:
                      condition:
                        lambda: "return id(nav_menu_roller).get_selected_index() == 2;"  # Settings
                      then:
                        - lvgl.page.show: settings_page
                      else:
                        - if:
                            condition:
                              lambda: "return id(nav_menu_roller).get_selected_index() == 3;"  # LED Brightness
                            then:
                              - lvgl.page.show: led_brightness_page
                            else:
                              - if:
                                  condition:
                                    lambda: "return id(nav_menu_roller).get_selected_index() == 4;"  # Auto-Shutoff Duration
                                  then:
                                    - lvgl.page.show: auto_shutoff_duration_page
                                  else:
                                    - if:
                                        condition:
                                          lambda: "return id(nav_menu_roller).get_selected_index() == 5;"  # Dial Brightness
                                        then:
                                          - lvgl.page.show: dial_brightness_page
                                        else:
                                          - if:
                                              condition:
                                                lambda: "return id(nav_menu_roller).get_selected_index() == 6;"  # Dial Sound
                                              then:
                                                - lvgl.page.show: sound_page
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: "return id(nav_menu_roller).get_selected_index() == 7;"  # Diagnostics
                                                    then:
                                                      - lvgl.page.show: diagnostics_page
                                                    else:
                                                      # Only index 8 ("About") left
                                                      # among the current options --
                                                      # add another explicit branch
                                                      # here, not a new bare else,
                                                      # once a tenth option exists.
                                                      - lvgl.page.show: about_page

