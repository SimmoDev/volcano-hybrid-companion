# Install with: pip install pre-commit && pre-commit install
# See docs/DEVELOPMENT.md for what each hook does and why.
repos:
  # Reformats components/volcano/*.h/.cpp in place using .clang-format (-style=file).
  # Pinned to match the version CI checks against (clang-format==22.1.8) --
  # see the CI job's own comment on why that matters.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
  - repo: local
    hooks:
      - id: check-markdown-links
        name: Check relative Markdown links resolve
        description: Blocks the commit on a broken relative link or #anchor in a tracked .md file.
        entry: python3 scripts/check_markdown_links.py
        language: system
        files: \.md$
      - id: readme-staleness-nudge
        name: Nudge about state-describing docs a code/ADR/example change skips
        description: Advisory only -- never fails the commit.
        entry: python3 scripts/check_readme_staleness.py
        language: system
        pass_filenames: false
        always_run: true
