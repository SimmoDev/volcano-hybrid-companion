# on_connect/on_disconnect fire on the raw BLE link, before volcano's own
# service-discovery/read-sweep completes -- combined with volcano's
# `connected` (READY-only, dial/volcano-entities.yaml), this is what lets
# the Home/Connections pages' BLE status distinguish CONNECTING from
# DISCONNECTED, which `connected` alone cannot (ADR-0009: it only ever
# reports true once READY). Both handlers only set ble_connecting and
# hand off to refresh_ble_connection_status (dial/scripts.yaml), which
# also knows about ble_enabled -- the Connections page's own release
# switch -- so this handler doesn't need to duplicate that logic.
#
# Releasing/reconnecting the connection itself (the Connections page's own
# switch, dial/connections-page.yaml) calls
# id(volcano_ble_client).set_enabled() directly via lambda -- not exposed
# as a YAML action by ble_client itself, the same "call the raw API when
# no automation action exists" pattern dial/hardware.yaml's on_boot
# already uses for LVGL/rtttl calls. set_enabled(false) both disconnects
# and stops parse_device() matching this device on future scans
# (confirmed by reading ble_client's own source), which is what actually
# suspends reconnection per ADR-0007 -- the plain ble_client.disconnect
# automation action alone would not.
#
# mac_address is a placeholder: ble_client's schema requires one, but the
# Volcano's real address is not known at build time. volcano's pairing:
# block (dial/volcano-entities.yaml) finds the unit by scanning, stores
# its address, and sets it on this client at boot (ADR-0013). Until an
# address is known the client has nothing to match, so it never connects
# -- the Dial still boots and runs its local UI.
ble_client:
  - mac_address: "00:00:00:00:00:00"
    id: volcano_ble_client
    on_connect:
      - globals.set:
          id: ble_connecting
          value: "true"
      - script.execute: refresh_ble_connection_status
    on_disconnect:
      - globals.set:
          id: ble_connecting
          value: "false"
      - script.execute: refresh_ble_connection_status


# WiFi serves four things: the Home page's WiFi status icon, the
# Connections page's own status/switch, reaching web_server below from a
# browser, and the Home Assistant `api` connection below -- the volcano
# component itself is BLE-only and has no dependency on it. Toggling WiFi
# off from the Connections page (via the wifi.enable/wifi.disable
# actions) doesn't route through these triggers for its own status text
# -- see that page's own comment for why.
#
# reboot_timeout is 0s: the ESPHome default reboots the device after 15
# minutes with no WiFi association, which would undo the Connections
# page's whole point -- a user who releases WiFi there, or whose network
# just drops, must keep full local control of the Volcano (ADR-0001,
# ADR-0011). Same reasoning as `api`'s reboot_timeout below. The cost is
# losing automatic recovery from a wedged WiFi stack.
#
# No ssid/password here: WiFi is provisioned at runtime rather than
# compiled in (ADR-0013), by improv_serial below. A device that has
# never been given a network still reaches this block's on_disconnect
# default (steady red), and reboot_timeout: 0s above already keeps it
# from being rebooted for want of one.
wifi:
  reboot_timeout: 0s
  on_connect:
    - lvgl.label.update:
        id: wifi_status_icon
        text_color: 0x00CC44
    - lvgl.label.update:
        id: connections_wifi_status_label
        text_color: 0x00CC44
        text: "Connected"
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status_icon
        text_color: 0xCC0000
    - lvgl.label.update:
        id: connections_wifi_status_label
        text_color: 0xCC0000
        text: "Disconnected"


# Provisions WiFi over the same USB connection used to flash the Dial
# (ADR-0013), rather than a captive portal's own AP and web form: scans
# for networks, connects, and saves the credentials to flash once
# connected, entirely within ESPHome's own improv_serial -- nothing here
# drives it. Speaks the Improv protocol (https://www.improv-wifi.com/serial/)
# that ESP Web Tools' browser flasher already knows, so Phase 4's install
# page offers "Configure Wi-Fi" as a step straight after flashing with no
# further work here; meanwhile it is reachable from `esphome dashboard`'s
# own Improv button, or by any Improv-serial client, over the same port
# `esphome logs` uses.
#
# No next_url: that is a link this device hands back once provisioning
# succeeds, for a client to offer as "open" -- Phase 4's install page is
# the natural target, and doesn't exist yet.
improv_serial:


# Home Assistant integration, per ADR-0012. Home Assistant reaches the
# same volcano entities as web_server below; the Dial keeps full local
# control of the Volcano with this connection absent or down, which is
# why reboot_timeout is 0s -- the ESPHome default reboots the device
# once no API client has connected for 15 minutes, and ADR-0001 forbids
# Home Assistant's reachability being load-bearing for the device.
#
# No compiled-in key (ADR-0013): `encryption:` with no `key:` boots the
# device unprovisioned. It accepts one bootstrap connection -- Home
# Assistant's own onboarding, or ESPHome dashboard's "Adopt" -- which
# pushes a real per-device key that ESPHome then saves to flash and uses
# exclusively from then on (confirmed by reading api_server.cpp's
# set_noise_psk/update_noise_psk_). No image ever ships a key that would
# unlock more than one device.
#
# on_client_connected/on_client_disconnected drive the Connections
# page's Home Assistant status line via refresh_ha_connection_status
# (dial/scripts.yaml), which re-checks api.connected rather than
# trusting either trigger's own direction -- see that script's comment.
api:
  encryption:
  reboot_timeout: 0s
  on_client_connected:
    - script.execute: refresh_ha_connection_status
  on_client_disconnected:
    - script.execute: refresh_ha_connection_status


# Brought back per ADR-0010's decision to retain web_server unchanged on
# the Dial firmware, matching the dev-board example
# (esp32-s3-devkit.yaml) exactly -- same port/local/version, same
# entity names and sorting_weight values, for a manual-testing control
# surface independent of the Dial's own LVGL UI. Same trust model as that
# example: no authentication, no TLS, fine on a trusted home network.
#
# Needs lvgl's buffer_size cut down (see dial/hardware.yaml's comment
# above its lvgl: block) to fit in RAM alongside BLE on this board: it is
# web_server's own footprint -- its HTTP server, bundled web assets and
# JSON entity list, none of which the lean api: protocol carries -- that
# forces the trim, not networking in general.
web_server:
  port: 80
  local: true
  version: 3


# Closes the two provisioning paths above after a fixed window, rather
# than leaving WiFi-improv listening and the API's bootstrap key
# answering indefinitely on a device its owner never got around to
# setting up (ADR-0013). ESPHome's own provisioning: component tracks
# every source that needs it -- api (registers itself once its
# encryption has no key) and network connectivity, which provisioning:
# tracks built in -- and closes the window once every one of them is
# either satisfied or the timeout below elapses; a power cycle reopens
# it (confirmed by reading provisioning.cpp). 20 minutes is generous for
# an unhurried first setup without leaving the bootstrap key open
# forever on a device that was put down mid-way through.
#
# Gates only WiFi/API onboarding, never the Volcano connection: BLE
# pairing and control run over their own path regardless (ADR-0001's
# standalone guarantee, the same carve-out api/wifi's own
# reboot_timeout above makes).
provisioning:
  timeout: 20min


# Blinks the BLE status icon while CONNECTING (ble_connecting, set by
# ble_client's on_connect/on_disconnect above and volcano's connected
# entity in dial/volcano-entities.yaml). A no-op the rest of the time,
# so it doesn't fight the steady colours refresh_ble_connection_status
# (dial/scripts.yaml) already set. Also requires ble_enabled: nothing is
# actively trying to reconnect while the Connections page's own switch
# has released the connection, whatever ble_connecting happens to hold --
# checked here too, defensively, rather than trusting every ble_connecting
# producer to already enforce that on its own.
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: "return id(ble_enabled) && id(ble_connecting);"
          then:
            - globals.set:
                id: ble_blink_on
                value: !lambda "return !id(ble_blink_on);"
            - lvgl.label.update:
                id: ble_status_icon
                text_color: !lambda "return lv_color_hex(id(ble_blink_on) ? 0xFFA500 : 0x552B00);"

