# Shared by both temperature entities' on_value and by
# display_units_fahrenheit's on_turn_on/on_turn_off (ADR-0008: the component
# always reports Celsius, so a unit change re-renders the last known value
# rather than waiting for the device's next report). Kept as two scripts,
# not one parameterised by which label/sensor to use, since ESPHome's YAML
# automations have no clean way to pass that in -- duplicating this much
# is simpler than the indirection needed to avoid it.
script:
  - id: refresh_current_temp_label
    then:
      - lvgl.label.update:
          id: current_temp_label
          text: !lambda |-
            float c = id(volcano_current_temperature).state;
            if (std::isnan(c))
              return std::string("--");
            float v = id(volcano_display_units_fahrenheit).state ? (c * 9.0f / 5.0f + 32.0f) : c;
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # ADR-0011's write-coalescing: fires 300ms after the encoder last
  # moved (mode: restart cancels and restarts the delay on every new
  # turn), not once per detent. VolcanoDevice refuses a second write to
  # a field while one is already outstanding (ADR-0009) and a confirmed
  # round trip is ~150-250ms on real hardware -- writing on every detent
  # would silently drop most of them. Guarded against a stale NaN
  # baseline; VolcanoBleClient's own range check would refuse it anyway,
  # but this avoids attempting a meaningless write in the first place.
  - id: commit_target_temperature
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: "return !std::isnan(id(pending_target_temp_c));"
          then:
            - number.set:
                id: volcano_target_temperature
                value: !lambda "return id(pending_target_temp_c);"
  # Reads pending_target_temp_c, not volcano_target_temperature.state --
  # this is the label a rotary turn updates immediately, before
  # commit_target_temperature's debounced write even fires, let alone
  # confirms.
  - id: refresh_target_temp_label
    then:
      - lvgl.label.update:
          id: target_temp_label
          text: !lambda |-
            float c = id(pending_target_temp_c);
            if (std::isnan(c))
              return std::string("--");
            float v = id(volcano_display_units_fahrenheit).state ? (c * 9.0f / 5.0f + 32.0f) : c;
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", v);
            return std::string(buf);
  # LED Brightness's, Auto-Shutoff Duration's and Dial Brightness's own
  # commit/refresh pairs -- same shape as commit_target_temperature/
  # refresh_target_temp_label above, but generated from
  # dial/numeric-value-page.yaml's shared template (see that file and
  # each page's own !include vars in m5stack-dial.yaml) rather
  # than declared here, since they're one part of that page template,
  # not a standalone script.
  # Dial Sound's flank-label colours (Off/On, same active-cyan/inactive-grey
  # convention as Settings' toggles) -- shared between dial/hardware.yaml's
  # on_boot (so the restored dial_sound_enabled value is reflected
  # immediately) and dial/sound-page.yaml's own switch on_value, rather
  # than duplicating the two lvgl.label.update calls in both places.
  - id: refresh_sound_labels
    then:
      - lvgl.label.update:
          id: sound_off_label
          text_color: !lambda "return id(dial_sound_enabled) ? lv_color_hex(0x888888) : lv_color_hex(0x00D9FF);"
      - lvgl.label.update:
          id: sound_on_label
          text_color: !lambda "return id(dial_sound_enabled) ? lv_color_hex(0x00D9FF) : lv_color_hex(0x888888);"
  # Computes BLE's status for two different surfaces from the same three
  # inputs -- ble_enabled (the Connections page's own switch),
  # volcano_connected (READY, per ADR-0009) and ble_connecting (the
  # link-up-but-not-READY window dial/connectivity.yaml's blink interval
  # also watches). The Home page's small icon deliberately keeps ADR-0011's
  # original three-state palette (steady green/flashing orange/red) rather
  # than gaining a fourth "off" colour of its own -- there's no room next
  # to it to explain what a new colour would mean, and "released" reads to
  # a glance at Home as just another way of being disconnected. The
  # Connections page's own status label is where that distinction actually
  # belongs, since it has room to say "Off" in words. Called from every
  # site that can change one of the three inputs: dial/connectivity.yaml's
  # ble_client on_connect/on_disconnect, dial/volcano-entities.yaml's
  # connected on_press/on_release, and this page's own switch. The blink
  # interval still owns alternating the Home icon's colour once this
  # script has set it to a steady orange for the Connecting case -- it
  # only acts while ble_connecting is true, so it doesn't fight the steady
  # colours this script sets for the other states.
  - id: refresh_ble_connection_status
    then:
      - lvgl.label.update:
          id: ble_status_icon
          text_color: !lambda |-
            if (id(volcano_connected).state)
              return lv_color_hex(0x00CC44);
            if (id(ble_connecting))
              return lv_color_hex(0xFFA500);
            return lv_color_hex(0xCC0000);
      - lvgl.label.update:
          id: connections_ble_status_label
          text_color: !lambda |-
            if (!id(ble_enabled))
              return lv_color_hex(0x888888);
            if (id(volcano_connected).state)
              return lv_color_hex(0x00CC44);
            if (id(ble_connecting))
              return lv_color_hex(0xFFA500);
            return lv_color_hex(0xCC0000);
          text: !lambda |-
            if (!id(ble_enabled))
              return std::string("Off");
            if (id(volcano_connected).state)
              return std::string("Connected");
            if (id(ble_connecting))
              return std::string("Connecting...");
            return std::string("Disconnected - in use?");
  # The Connections page's own Off/On flanking-label colours for each
  # switch, same active-cyan/inactive-grey convention as Settings/Dial
  # Sound -- kept separate from refresh_ble_connection_status above since
  # that one also drives the Home page icon, which has no flanking labels
  # of its own.
  - id: refresh_ble_switch_labels
    then:
      - lvgl.label.update:
          id: connections_ble_off_label
          text_color: !lambda "return id(ble_enabled) ? lv_color_hex(0x888888) : lv_color_hex(0x00D9FF);"
      - lvgl.label.update:
          id: connections_ble_on_label
          text_color: !lambda "return id(ble_enabled) ? lv_color_hex(0x00D9FF) : lv_color_hex(0x888888);"
  - id: refresh_wifi_switch_labels
    then:
      - lvgl.label.update:
          id: connections_wifi_off_label
          text_color: !lambda "return id(wifi_enabled) ? lv_color_hex(0x888888) : lv_color_hex(0x00D9FF);"
      - lvgl.label.update:
          id: connections_wifi_on_label
          text_color: !lambda "return id(wifi_enabled) ? lv_color_hex(0x00D9FF) : lv_color_hex(0x888888);"
  # The Connections page's Home Assistant status line (ADR-0012), driven
  # off the api component's on_client_connected/on_client_disconnected
  # triggers (dial/connectivity.yaml). Re-checks api.connected on every
  # event rather than tracking a per-client count, so a second client --
  # an `esphome logs` session over the API, say -- connecting or
  # dropping doesn't flip the line while Home Assistant itself is still
  # connected. api.connected is true for *any* API client, so the
  # converse also holds: with Home Assistant down but an `esphome logs`
  # session attached, the line still reads Connected. ADR-0012 scopes
  # this row to "whether an API client is currently connected", not to
  # Home Assistant specifically -- deliberate, and ESPHome exposes no
  # per-client identity to filter on in any case. Indicator only:
  # ADR-0012 gives Home Assistant no switch here, so there are no
  # flanking Off/On labels to keep in sync the way the BLE and WiFi
  # rows have.
  - id: refresh_ha_connection_status
    then:
      - if:
          condition:
            api.connected:
          then:
            - lvgl.label.update:
                id: connections_ha_status_label
                text_color: 0x00CC44
                text: "Connected"
          else:
            - lvgl.label.update:
                id: connections_ha_status_label
                text_color: 0xCC0000
                text: "Disconnected"
  - id: refresh_time_of_operation_label
    then:
      - lvgl.label.update:
          id: diagnostics_time_of_operation_value
          text: !lambda |-
            float h = id(volcano_hours_of_operation).state;
            float m = id(volcano_minutes_of_operation).state;
            if (std::isnan(h) || std::isnan(m))
              return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0fh %.0fm", h, m);
            return std::string(buf);
  # Shared by both the roller's on_click (touch, guarded to POINTER
  # there) and dial_button's on_release (button, on the Menu page) --
  # one place to add a branch when a new page/option is added, rather
  # than keeping the touch and button paths in sync by hand.
  #
  # Dispatches on get_selected_index()'s numeric index rather than
  # get_selected_text(): dial/menu-page.yaml's roller options: list is
  # the single source of truth for both the displayed label and its
  # index, so renaming/rewording an option can't silently desync it
  # from this dispatch the way a duplicated exact-string comparison
  # could -- a typo or rewrite would simply select a different, wrong
  # index rather than falling through unnoticed to the final else. The
  # index below must still match the options: list order.
  - id: confirm_menu_selection
    then:
      - lambda: |-
          ESP_LOGD("main", "Menu confirmed: %s", id(nav_menu_roller).get_selected_text().c_str());
      - if:
          condition:
            lambda: "return id(nav_menu_roller).get_selected_index() == 0;"  # Home
          then:
            - lvgl.page.show: home_page
          else:
            - if:
                condition:
                  lambda: "return id(nav_menu_roller).get_selected_index() == 1;"  # Connections
                then:
                  - lvgl.page.show: connections_page
                else:
                  - if:
                      condition:
                        lambda: "return id(nav_menu_roller).get_selected_index() == 2;"  # Pairing
                      then:
                        - lvgl.page.show: pairing_page
                      else:
                        - if:
                            condition:
                              lambda: "return id(nav_menu_roller).get_selected_index() == 3;"  # Settings
                            then:
                              - lvgl.page.show: settings_page
                            else:
                              - if:
                                  condition:
                                    lambda: "return id(nav_menu_roller).get_selected_index() == 4;"  # LED Brightness
                                  then:
                                    - lvgl.page.show: led_brightness_page
                                  else:
                                    - if:
                                        condition:
                                          lambda: "return id(nav_menu_roller).get_selected_index() == 5;"  # Auto-Shutoff Duration
                                        then:
                                          - lvgl.page.show: auto_shutoff_duration_page
                                        else:
                                          - if:
                                              condition:
                                                lambda: "return id(nav_menu_roller).get_selected_index() == 6;"  # Dial Brightness
                                              then:
                                                - lvgl.page.show: dial_brightness_page
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: "return id(nav_menu_roller).get_selected_index() == 7;"  # Dial Sound
                                                    then:
                                                      - lvgl.page.show: sound_page
                                                    else:
                                                      - if:
                                                          condition:
                                                            lambda: "return id(nav_menu_roller).get_selected_index() == 8;"  # Diagnostics
                                                          then:
                                                            - lvgl.page.show: diagnostics_page
                                                          else:
                                                            # Only index 9 ("About") left among the current
                                                            # options -- add another explicit branch here, not a new
                                                            # bare else, once an eleventh option exists.
                                                            - lvgl.page.show: about_page

  # Hands the Pairing page back to Home once a Volcano is paired, but only
  # when the Dial opened the page itself on a first run (pairing_auto_opened,
  # dial/state.yaml). The pause lets "Paired" be seen first, and is why the
  # conditions are checked again after it: the user may have left the page
  # in the meantime, which clears the flag, and must not be moved on from
  # wherever they have gone. restart, so a second pairing inside the pause
  # just restarts it.
  - id: return_home_after_first_run_pairing
    mode: restart
    then:
      - delay: 1500ms
      - if:
          condition:
            and:
              - lambda: "return id(pairing_auto_opened) && id(volcano_pairing).paired();"
              - lvgl.page.is_showing: pairing_page
          then:
            - lvgl.page.show: home_page

  # Renders the Pairing page from the pairing state (dial/pairing-page.yaml):
  # what the status line says and in what colour, whether the roller of
  # Volcanos found and the action button are showing, and what the button
  # reads. Runs on every change of the pairing entities and once on page
  # load, so a change that landed while another page was showing can't
  # leave this one stale.
  #
  # The roller's options are the Volcanos found, so they are only set
  # while choosing, and only when they differ from what it already holds --
  # setting them resets its scroll position, which must not happen under a
  # user who is turning it. The candidate list is stable once a window has
  # closed, so in practice that is once.
  #
  # Focuses the roller into edit mode only while this page is showing and
  # choosing, so a turn scrolls it straight away; done here, not on_load,
  # because the choice can arrive while the page is already open. On
  # another page the focus is left alone, as the encoder must stay with
  # the Menu's roller there.
  - id: refresh_pairing_page
    then:
      - lambda: |-
          using State = volcano::VolcanoPairing::State;
          const State state = id(volcano_pairing).state();
          const char *status = "";
          const char *detail = "";
          const char *action = nullptr;
          uint32_t colour = 0xFFFFFF;
          bool choosing = false;
          switch (state) {
            case State::SCANNING:
              status = "Searching...";
              colour = 0xFFA500;
              detail = "Volcano on and in range";
              break;
            case State::CHOOSING:
              status = "Choose one";
              colour = 0x00D9FF;
              detail = "Turn, then press";
              action = "Search again";
              choosing = true;
              break;
            case State::NOT_FOUND:
              status = "Not found";
              colour = 0xCC0000;
              // CONN-003: a Volcano held by another client stops
              // advertising, and looks exactly like one that is off.
              detail = "Is it on, and not in use?";
              action = "Search again";
              break;
            case State::PAIRED:
              status = "Paired";
              colour = 0x00CC44;
              action = "Hold to forget";
              break;
          }
          const std::string address = id(volcano_pairing).address_str();
          lv_label_set_text(id(pairing_status_label), status);
          lv_obj_set_style_text_color(id(pairing_status_label), lv_color_hex(colour), 0);
          lv_label_set_text(id(pairing_detail_label), state == State::PAIRED ? address.c_str() : detail);

          if (choosing) {
            std::string options;
            for (size_t i = 0; i < id(volcano_pairing).candidate_count(); i++) {
              char buf[40];
              snprintf(buf, sizeof(buf), "%s  %d dBm", id(volcano_pairing).candidate_serial(i),
                       id(volcano_pairing).candidate_rssi(i));
              if (!options.empty())
                options += '\n';
              options += buf;
            }
            // LVGL's own call, not the ESPHome roller's set_options(): that
            // wrapper's signature has changed between ESPHome releases, and
            // LVGL copies the string, so nothing here has to outlive it.
            // The wrapper's cached copy of the options goes stale as a
            // result, which is harmless: only the selected index is read
            // back from this roller.
            const char *shown = lv_roller_get_options(id(pairing_roller).obj);
            if (shown == nullptr || options != shown)
              lv_roller_set_options(id(pairing_roller).obj, options.c_str(), LV_ROLLER_MODE_NORMAL);
            lv_obj_remove_flag(id(pairing_roller).obj, LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(pairing_roller).obj, LV_OBJ_FLAG_HIDDEN);
          }

          if (action != nullptr) {
            lv_label_set_text(id(pairing_action_label), action);
            lv_obj_remove_flag(id(pairing_action_button), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(pairing_action_button), LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            and:
              - lvgl.page.is_showing: pairing_page
              - lambda: "return id(volcano_pairing).state() == volcano::VolcanoPairing::State::CHOOSING;"
          then:
            - lvgl.widget.focus:
                id: pairing_roller
                editing: true
