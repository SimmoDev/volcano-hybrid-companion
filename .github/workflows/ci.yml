name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  esphome:
    name: Validate and compile the ESPHome configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      # esphome is installed unpinned above, so the version actually
      # resolved isn't fixed -- captured here so the cache key below can
      # include it, rather than a bare per-OS key that would keep restoring
      # an older release's toolchain forever after an ESPHome upgrade
      # changes what it needs (see the comment below: this already happened
      # once, for which toolchain directory gets used at all).
      - name: Get installed ESPHome version
        id: esphome_version
        run: echo "version=$(esphome version | head -n1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # esphome config/compile need only placeholder values here, not a
      # real device -- see docs/DEVELOPMENT.md. secrets.yaml itself is
      # gitignored in both trees, so CI creates each fresh from its
      # committed example: examples/ for the dev-board scaffold,
      # firmware/ for the Dial firmware config.
      - name: Create placeholder secrets.yaml
        run: |
          cp examples/secrets.yaml.example examples/secrets.yaml
          cp firmware/secrets.yaml.example firmware/secrets.yaml
      # Recent ESPHome releases fetch their own ESP-IDF toolchain into
      # ~/.cache/esphome rather than using PlatformIO's ~/.platformio --
      # confirmed by actually running this job locally with `act` rather
      # than assumed, since which one a given unpinned `pip install
      # esphome` resolves to isn't fixed. Both are cached so this doesn't
      # silently stop working (no cache, just a slower job) on either
      # build path.
      - name: Cache ESPHome/PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-toolchains-${{ runner.os }}-${{ steps.esphome_version.outputs.version }}
          restore-keys: |
            esphome-toolchains-${{ runner.os }}-
      - name: esphome config (dev board)
        run: esphome config examples/esp32-s3-devkit.yaml
      - name: esphome compile (dev board)
        run: esphome compile examples/esp32-s3-devkit.yaml
      # The Dial firmware (firmware/m5stack-dial.yaml), reading
      # firmware/secrets.yaml created above -- its ble_client needs
      # volcano_mac_address, its wifi (for the Home page's WiFi status
      # icon and its own web_server page) needs wifi_ssid/wifi_password,
      # and its api: block (Phase 3 per ADR-0012, validated here against
      # the example key) needs api_encryption_key. web_server is retained
      # per ADR-0010.
      - name: esphome config (M5Stack Dial firmware)
        run: esphome config firmware/m5stack-dial.yaml
      - name: esphome compile (M5Stack Dial firmware)
        run: esphome compile firmware/m5stack-dial.yaml

  volcano-device-tests:
    name: Volcano component host-side tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make test
        working-directory: components/volcano/test
        run: make test

  markdown-links:
    name: Check relative Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Same script the check-markdown-links pre-commit hook runs, so a
      # broken relative link or #anchor is caught server-side too rather
      # than only for contributors who have pre-commit installed. No deps:
      # the script is stdlib-only.
      - name: check-markdown-links
        run: python3 scripts/check_markdown_links.py $(git ls-files '*.md')

  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned via the clang-format PyPI package rather than apt's
      # clang-format, whose version tracks the runner image and isn't
      # pinned here -- a version drift between what a contributor ran
      # locally and what CI checks against would fail the check on
      # formatting nobody actually changed.
      - name: Install clang-format
        run: pip install clang-format==22.1.8
      - name: clang-format --dry-run --Werror
        run: clang-format --dry-run --Werror $(git ls-files 'components/volcano/*.h' 'components/volcano/*.cpp')
